<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz – Volksrechte & Parlament</title>
<style>
  :root{
    --poly: polygon(0 50%, 22px 0, calc(100% - 22px) 0, 100% 50%, calc(100% - 22px) 100%, 22px 100%);
    --poly-sm: polygon(0 50%, 9px 0, calc(100% - 9px) 0, 100% 50%, calc(100% - 9px) 100%, 9px 100%);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .wrap{min-height:100vh;padding:14px;
    background:radial-gradient(ellipse at 50% 22%,#1f3f86 0%,#0c1f4c 46%,#050b1d 100%);}
  .inner{max-width:760px;margin:0 auto;}
  .kicker{text-align:center;font-size:11px;font-weight:700;letter-spacing:.25em;
    text-transform:uppercase;color:rgba(252,211,77,.8);}
  .title{text-align:center;font-size:23px;font-weight:800;color:#fff;margin-top:4px;
    text-shadow:0 0 14px rgba(246,177,60,.55);}
  .moneybar{display:flex;justify-content:center;margin:12px 0;}
  .moneypill{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:999px;
    background:linear-gradient(180deg,#1a3c86,#0c1f4c);border:1.5px solid rgba(244,173,51,.6);}
  .moneypill .lbl{font-size:11px;font-weight:600;color:#bcd0f5;text-transform:uppercase;letter-spacing:.08em;}
  .moneypill .amt{font-size:16px;font-weight:800;color:#fcd34d;text-shadow:0 0 8px rgba(246,177,60,.5);}
  .dots{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-bottom:12px;}
  .dot{width:24px;height:24px;display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:700;color:#fff;clip-path:var(--poly-sm);}
  .row{display:flex;gap:16px;}
  .main{flex:1;min-width:0;}
  .statusrow{display:flex;align-items:center;justify-content:space-between;
    gap:8px;margin-bottom:8px;padding:0 4px;}
  .status-l{font-size:12px;font-weight:600;color:#bcd0f5;}
  .status-l .rep{color:#fcd34d;display:inline-flex;align-items:center;gap:4px;}
  .status-r{display:flex;align-items:center;gap:8px;}
  .stufe{font-size:11px;font-weight:700;color:#fcd34d;white-space:nowrap;}
  .joker{font-size:12px;font-weight:800;padding:4px 12px;border-radius:999px;
    transition:filter .15s;font-family:inherit;}
  .joker--ready{background:linear-gradient(180deg,#1a3c86,#0c1f4c);border:2px solid #f4ad33;
    color:#f4ad33;cursor:pointer;filter:drop-shadow(0 0 5px rgba(246,177,60,.55));}
  .joker--ready:hover{filter:brightness(1.3);}
  .joker--used{background:linear-gradient(180deg,#1a2540,#0c1326);border:2px solid #475569;
    color:#64748b;cursor:default;}
  .joker--used span{text-decoration:line-through;}
  .joker--off{background:linear-gradient(180deg,#15295c,#0a1838);border:2px solid rgba(244,173,51,.3);
    color:rgba(244,173,51,.45);cursor:default;}
  .q-outer{clip-path:var(--poly);background:linear-gradient(180deg,#9fc0fb,#2a47a0);
    padding:2.5px;filter:drop-shadow(0 3px 8px rgba(0,0,0,.5));}
  .q-inner{clip-path:var(--poly);background:linear-gradient(180deg,#11295f,#0a1c46);
    min-height:92px;display:flex;align-items:center;justify-content:center;
    text-align:center;padding:14px 34px;}
  .q-inner p{font-size:15px;font-weight:700;color:#fff;line-height:1.35;}
  .answers{display:grid;grid-template-columns:1fr;gap:10px;margin-top:12px;}
  @media(min-width:560px){.answers{grid-template-columns:1fr 1fr;}}
  .ans{position:relative;width:100%;padding:2.5px;clip-path:var(--poly);
    border:none;font-family:inherit;transition:filter .15s;
    background:linear-gradient(180deg,#8fb3f7,#27429a);
    filter:drop-shadow(0 2px 4px rgba(0,0,0,.45));}
  .ans-inner{display:flex;align-items:center;min-height:58px;
    padding-left:30px;padding-right:26px;clip-path:var(--poly);
    background:linear-gradient(180deg,#1a3c86,#0d2356 52%,#081640);}
  .ans .letter{font-weight:800;font-size:16px;margin-right:12px;flex-shrink:0;color:#f4ad33;}
  .ans .txt{text-align:left;font-size:14.5px;font-weight:600;color:#fff;line-height:1.2;padding:8px 0;}
  .ans .mark{margin-left:auto;width:20px;height:20px;flex-shrink:0;color:#fff;}
  .ans.clickable{cursor:pointer;}
  .ans.clickable:hover{filter:brightness(1.25);}
  .ans--correct{background:linear-gradient(180deg,#69f0a6,#0a5c2b);
    filter:drop-shadow(0 0 9px rgba(52,211,153,.75));}
  .ans--correct .ans-inner{background:linear-gradient(180deg,#23ad59,#118040 52%,#0a5c2b);}
  .ans--correct .letter{color:#fff;}
  .ans--wrong{background:linear-gradient(180deg,#ffb0b0,#7e1b1b);
    filter:drop-shadow(0 0 9px rgba(248,113,113,.7));}
  .ans--wrong .ans-inner{background:linear-gradient(180deg,#e23a37,#bb1d1d 52%,#7e1b1b);}
  .ans--wrong .letter{color:#fff;}
  .ans--dim{opacity:.32;}
  .ans--removed{opacity:.16;}
  .feedback{margin-top:12px;border-radius:8px;padding:11px 16px;border:1px solid;}
  .feedback.ok{background:rgba(16,122,64,.22);border-color:rgba(52,211,153,.4);}
  .feedback.no{background:rgba(180,40,40,.22);border-color:rgba(248,113,113,.4);}
  .feedback .ftitle{font-size:14px;font-weight:700;}
  .feedback.ok .ftitle{color:#6ee7a8;}
  .feedback.no .ftitle{color:#fca5a5;}
  .feedback p{font-size:13px;color:rgba(219,234,254,.9);margin-top:4px;line-height:1.5;}
  .btn-gold{margin-top:12px;width:100%;font-weight:700;padding:12px;border-radius:8px;
    color:#1a1100;border:none;cursor:pointer;font-family:inherit;font-size:15px;
    background:linear-gradient(180deg,#f7c14e,#e0921a);transition:filter .15s;
    display:flex;align-items:center;justify-content:center;gap:8px;}
  .btn-gold:hover{filter:brightness(1.1);}
  .panel{border-radius:12px;padding:28px 20px;text-align:center;border:1px solid rgba(251,191,36,.3);
    background:linear-gradient(180deg,#13306c,#0a1c46);}
  .panel-icon{width:60px;height:60px;margin:0 auto;border-radius:999px;
    display:flex;align-items:center;justify-content:center;}
  .panel h2{font-size:19px;font-weight:800;color:#fff;margin-top:12px;}
  .panel h2.win{font-size:26px;color:#fcd34d;text-shadow:0 0 14px rgba(246,177,60,.6);}
  .panel .sub{font-size:13px;color:#bcd0f5;margin-top:4px;}
  .openlist{margin-top:16px;display:flex;flex-direction:column;gap:8px;text-align:left;}
  .openlist .item{border-radius:6px;padding:8px 12px;font-size:13px;color:#eff6ff;
    border:1px solid rgba(251,191,36,.25);background:rgba(246,177,60,.12);
    display:flex;justify-content:space-between;gap:12px;}
  .openlist .item .b{color:#fcd34d;font-weight:700;white-space:nowrap;}
  .resultbox{margin-top:20px;border-radius:8px;padding:20px 0;
    border:1px solid rgba(252,211,77,.3);background:rgba(246,177,60,.1);}
  .resultbox .big{display:flex;align-items:center;justify-content:center;gap:8px;}
  .resultbox .big .amt{font-size:30px;font-weight:800;color:#fcd34d;
    text-shadow:0 0 12px rgba(246,177,60,.6);}
  .resultbox .cap{font-size:12px;color:#bcd0f5;margin-top:4px;}
  .resultbox .meta{font-size:11px;color:rgba(147,197,253,.7);margin-top:10px;
    border-top:1px solid rgba(147,197,253,.15);padding-top:8px;}
  .ladder{display:none;width:144px;flex-shrink:0;}
  @media(min-width:768px){.ladder{display:block;}.dots{display:none;}}
  .ladder .head{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
    color:rgba(252,211,77,.8);text-align:center;margin-bottom:8px;}
  .rung{clip-path:var(--poly-sm);padding:1.5px;margin-bottom:4px;}
  .rung-inner{clip-path:var(--poly-sm);display:flex;align-items:center;
    justify-content:space-between;padding:4px 12px;}
  .rung .amt{font-size:11px;font-weight:600;}
  .rung .amt.ms{font-weight:800;}
  .rung .ricon{width:12px;height:12px;color:#fff;}
  .foot{text-align:center;font-size:11px;color:rgba(147,197,253,.5);margin-top:16px;}
  svg{display:block;}
</style>
</head>
<body>
<div class="wrap">
  <div class="inner">
    <div class="kicker">HKV Aarau · ABU</div>
    <div class="title">Volksrechte &amp; Parlament</div>
    <div id="app"></div>
    <div class="foot">ABU · Allgemeinbildender Unterricht · HKV Aarau</div>
  </div>
</div>

<script>
"use strict";

var QUESTIONS = [
  {frage:"Wie viele gültige Unterschriften braucht eine Volksinitiative – und in welcher Frist?",
   optionen:["50'000 Unterschriften innert 100 Tagen","100'000 Unterschriften innert 18 Monaten",
     "100'000 Unterschriften innert 100 Tagen","50'000 Unterschriften innert 18 Monaten"],
   richtig:1,
   erklaerung:"Für eine Volksinitiative müssen 100'000 gültige Unterschriften innerhalb von 18 Monaten gesammelt werden."},
  {frage:"Wie viele Unterschriften braucht das fakultative Referendum – und in welcher Frist?",
   optionen:["50'000 Unterschriften innert 100 Tagen","100'000 Unterschriften innert 18 Monaten",
     "50'000 Unterschriften innert 18 Monaten","30'000 Unterschriften innert 90 Tagen"],
   richtig:0,
   erklaerung:"Beim fakultativen Referendum müssen 50'000 Unterschriften innerhalb von 100 Tagen gegen ein neues Bundesgesetz gesammelt werden."},
  {frage:"Das obligatorische Referendum muss durch eine Unterschriftensammlung ausgelöst werden.",
   typ:"wf",richtig:1,
   erklaerung:"Falsch. Das obligatorische Referendum kommt automatisch – ohne Unterschriftensammlung. Es ist bei bestimmten Beschlüssen wie Verfassungsänderungen zwingend."},
  {frage:"Welches Mehr braucht eine Volksinitiative zur Annahme?",
   optionen:["Nur das einfache Volksmehr","Nur das Ständemehr",
     "Das doppelte Mehr (Volksmehr UND Ständemehr)","Eine Zweidrittelmehrheit im Parlament"],
   richtig:2,
   erklaerung:"Eine Volksinitiative ändert die Bundesverfassung. Darum braucht sie das doppelte Mehr: die Mehrheit der Abstimmenden (Volksmehr) UND die Mehrheit der Kantone (Ständemehr)."},
  {frage:"Welches Mehr genügt beim fakultativen Referendum zur Annahme bzw. Ablehnung der Vorlage?",
   optionen:["Das einfache Volksmehr","Das doppelte Mehr","Nur das Ständemehr","Eine Dreiviertelmehrheit"],
   richtig:0,
   erklaerung:"Beim fakultativen Referendum genügt das einfache Volksmehr – also die Mehrheit der Abstimmenden. Ein Ständemehr ist nicht nötig."},
  {frage:"Wie viele Mitglieder hat der Nationalrat?",
   optionen:["46 Mitglieder","100 Mitglieder","200 Mitglieder","246 Mitglieder"],
   richtig:2,
   erklaerung:"Der Nationalrat – die «grosse Kammer» – hat 200 Mitglieder. Er vertritt das Volk; grosse Kantone haben mehr Sitze."},
  {frage:"Wie viele Mitglieder hat der Ständerat?",
   optionen:["26 Mitglieder","46 Mitglieder","100 Mitglieder","200 Mitglieder"],
   richtig:1,
   erklaerung:"Der Ständerat – die «kleine Kammer» – hat 46 Mitglieder: je 2 pro Vollkanton, je 1 pro Halbkanton."},
  {frage:"Wen vertritt der Ständerat?",
   optionen:["Das gesamte Schweizer Volk","Die Kantone","Die politischen Parteien","Die Berufsverbände"],
   richtig:1,
   erklaerung:"Der Ständerat vertritt die Kantone. Der Nationalrat hingegen vertritt das Volk."},
  {frage:"Nationalrat und Ständerat zusammen bilden die Bundesversammlung.",
   typ:"wf",richtig:0,
   erklaerung:"Richtig. Nationalrat (200) und Ständerat (46) bilden zusammen die Bundesversammlung – das Parlament der Schweiz."},
  {frage:"Zu welcher Staatsgewalt gehört die Bundesversammlung?",
   optionen:["Exekutive (Vollziehung)","Judikative (Rechtsprechung)",
     "Legislative (Gesetzgebung)","Sie gehört zu keiner Staatsgewalt"],
   richtig:2,
   erklaerung:"Die Bundesversammlung ist die Legislative: Sie erlässt Gesetze, beschliesst das Budget und wählt die Regierung. Die Exekutive ist der Bundesrat, die Judikative das Bundesgericht."},
  {frage:"Bei welchem Beschluss kommt zwingend ein obligatorisches Referendum?",
   optionen:["Bei jedem neuen Bundesgesetz","Bei einer Änderung der Bundesverfassung",
     "Bei jeder Erhöhung der Mehrwertsteuer um 0,1 %","Bei der Wahl des Bundesrats"],
   richtig:1,
   erklaerung:"Verfassungsänderungen müssen immer automatisch vors Volk – mit doppeltem Mehr. Das ist das obligatorische Referendum."},
  {frage:"Wie oft werden Nationalrat und Ständerat gewählt?",
   optionen:["Jedes Jahr","Alle 2 Jahre","Alle 4 Jahre","Alle 8 Jahre"],
   richtig:2,
   erklaerung:"Nationalrat und Ständerat werden alle 4 Jahre gewählt. Stimmberechtigt ist, wer 18 Jahre alt ist und das Schweizer Bürgerrecht besitzt."}
];
var WF_LABELS = ["Wahr","Falsch"];
var BETRAG = [100,200,500,1000,2000,5000,10000,20000,50000,100000,500000,1000000];
var GESAMT = BETRAG.reduce(function(a,b){return a+b;},0);
function chf(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,"'");}

var ICON = {
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" width="100%" height="100%"><path d="M20 6 9 17l-5-5"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" width="100%" height="100%"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  coins:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="100%" height="100%"><circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/><path d="M7 6h1v4"/><path d="m16.71 13.88.7.71-2.82 2.82"/></svg>',
  trophy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="100%" height="100%"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>',
  repeat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="100%" height="100%"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>',
  rotate:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="100%" height="100%"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>'
};

var RUNG_BG = {
  current:"linear-gradient(180deg,#f6b13c,#d98512)",
  richtig:"linear-gradient(180deg,#1f9d51,#0c5d2c)",
  falsch:"linear-gradient(180deg,#c4302d,#7c1b1b)",
  leer:"linear-gradient(180deg,#173061,#0c1d44)"
};

var st;
function initState(){
  st = {
    runde: QUESTIONS.map(function(_,i){return i;}),
    pos:0, selected:null, beantwortet:false, falsche:[],
    rundeNr:1, erstePunkte:0, phase:"quiz",
    status: QUESTIONS.map(function(){return null;}),
    jokerVerfuegbar:true, entfernt:[]
  };
}

function rungColor(qi,fIndex){
  if(st.phase==="quiz" && qi===fIndex) return "current";
  if(st.status[qi]==="richtig") return "richtig";
  if(st.status[qi]==="falsch") return "falsch";
  return "leer";
}

function waehlen(i){
  if(st.beantwortet || st.entfernt.indexOf(i)!==-1) return;
  var fIndex=st.runde[st.pos], frage=QUESTIONS[fIndex];
  st.selected=i; st.beantwortet=true;
  st.status[fIndex]=(i===frage.richtig)?"richtig":"falsch";
  if(i!==frage.richtig && st.falsche.indexOf(fIndex)===-1) st.falsche.push(fIndex);
  render();
}

function jokerNutzen(){
  var fIndex=st.runde[st.pos], frage=QUESTIONS[fIndex];
  var istWF=frage.typ==="wf";
  if(!st.jokerVerfuegbar || st.beantwortet || istWF || st.entfernt.length>0) return;
  var opts=(istWF?WF_LABELS:frage.optionen);
  var falscheOpt=[];
  for(var k=0;k<opts.length;k++){ if(k!==frage.richtig) falscheOpt.push(k); }
  falscheOpt.sort(function(){return Math.random()-0.5;});
  st.entfernt=falscheOpt.slice(0,2);
  st.jokerVerfuegbar=false;
  render();
}

function weiter(){
  if(st.pos < st.runde.length-1){
    st.pos++; st.selected=null; st.beantwortet=false; st.entfernt=[];
    render(); return;
  }
  if(st.rundeNr===1) st.erstePunkte=QUESTIONS.length - st.falsche.length;
  st.phase = (st.falsche.length===0)?"fertig":"rundenende";
  render();
}

function wiederholungStarten(){
  st.runde=st.falsche.slice(); st.falsche=[];
  st.pos=0; st.selected=null; st.beantwortet=false; st.entfernt=[];
  st.rundeNr++; st.phase="quiz";
  render();
}

function neustart(){ initState(); render(); }

function noteText(){
  var q=st.erstePunkte/QUESTIONS.length;
  if(q>=0.9) return "Hervorragend – fast alles auf Anhieb!";
  if(q>=0.7) return "Stark gespielt – die Wiederholung hat den Rest gefestigt.";
  if(q>=0.5) return "Geschafft – die Wiederholungsrunden haben geholfen.";
  return "Durchgekämpft – jetzt sitzt jede Frage.";
}

function ladderHTML(fIndex){
  var h='<div class="ladder"><div class="head">Gewinnstufen</div>';
  for(var k=0;k<12;k++){
    var qi=11-k, c=rungColor(qi,fIndex), ms=(qi===3||qi===7||qi===11);
    var innerBg=(c==="leer")?"linear-gradient(180deg,#0e2152,#081639)":"transparent";
    var col=(c==="leer")?(ms?"#f4ad33":"#7f9fd6"):(c==="current"?"#1a1100":"#fff");
    var icon="";
    if(c==="richtig") icon='<span class="ricon">'+ICON.check+'</span>';
    if(c==="falsch") icon='<span class="ricon">'+ICON.x+'</span>';
    var fil=(c==="current")?"filter:drop-shadow(0 0 6px rgba(246,177,60,.9));":"";
    h+='<div class="rung" style="background:'+RUNG_BG[c]+';'+fil+'">'
      +'<div class="rung-inner" style="background:'+innerBg+';">'
      +'<span class="amt'+(ms?' ms':'')+'" style="color:'+col+';">'+chf(BETRAG[qi])+'</span>'
      +icon+'</div></div>';
  }
  return h+'</div>';
}

function dotsHTML(fIndex){
  var h='<div class="dots">';
  for(var qi=0;qi<12;qi++){
    var c=rungColor(qi,fIndex);
    var fil=(c==="current")?"filter:drop-shadow(0 0 5px rgba(246,177,60,.9));":"";
    h+='<div class="dot" style="background:'+RUNG_BG[c]+';'+fil+'">'+(qi+1)+'</div>';
  }
  return h+'</div>';
}

function render(){
  var app=document.getElementById("app");
  var fIndex=st.runde[st.pos], frage=QUESTIONS[fIndex];
  var gewonnen=0;
  for(var g=0;g<12;g++){ if(st.status[g]==="richtig") gewonnen+=BETRAG[g]; }

  var html="";

  // MoneyBar
  if(st.phase==="quiz" || st.phase==="rundenende"){
    html+='<div class="moneybar"><div class="moneypill">'
      +'<span style="width:16px;height:16px;color:#fcd34d;">'+ICON.coins+'</span>'
      +'<span class="lbl">Gewonnen</span>'
      +'<span class="amt">CHF '+chf(gewonnen)+'</span></div></div>';
  }

  if(st.phase==="quiz"){
    html+=dotsHTML(fIndex);
    html+='<div class="row"><div class="main">';

    // Statuszeile + Joker
    var istWF=frage.typ==="wf";
    var jokerNutzbar=st.jokerVerfuegbar && !st.beantwortet && !istWF && st.entfernt.length===0;
    var jStatus=(!st.jokerVerfuegbar)?"used":(jokerNutzbar?"ready":"off");
    var jTitle=(jStatus==="used")?"Joker bereits verwendet":
      (jStatus==="off"?(istWF?"Beim Wahr/Falsch nicht nötig":"Erst bei der nächsten offenen Frage"):
      "Zwei falsche Antworten entfernen");
    var statusL = st.rundeNr>1
      ? '<span class="rep"><span style="width:14px;height:14px;">'+ICON.repeat+'</span>Wiederholung · Runde '+st.rundeNr+'</span>'
      : 'Frage '+(st.pos+1)+' von '+st.runde.length;

    html+='<div class="statusrow"><span class="status-l">'+statusL+'</span>'
      +'<span class="status-r">'
      +'<span class="stufe">Stufe CHF '+chf(BETRAG[fIndex])+'</span>'
      +'<button class="joker joker--'+jStatus+'" id="joker" title="'+jTitle+'">'
      +'<span>50 : 50</span></button>'
      +'</span></div>';

    // Frage
    html+='<div class="q-outer"><div class="q-inner"><p>'+frage.frage+'</p></div></div>';

    // Antworten
    var opts=(istWF?WF_LABELS:frage.optionen);
    html+='<div class="answers">';
    for(var i=0;i<opts.length;i++){
      var letter=String.fromCharCode(65+i);
      var istEntfernt=st.entfernt.indexOf(i)!==-1;
      if(istEntfernt){
        html+='<div class="ans ans--removed"><div class="ans-inner">'
          +'<span class="letter">'+letter+'</span></div></div>';
        continue;
      }
      var cls="ans", mark="";
      if(st.beantwortet){
        if(i===frage.richtig){ cls+=" ans--correct"; mark='<span class="mark">'+ICON.check+'</span>'; }
        else if(i===st.selected){ cls+=" ans--wrong"; mark='<span class="mark">'+ICON.x+'</span>'; }
        else { cls+=" ans--dim"; }
      } else { cls+=" clickable"; }
      html+='<button class="'+cls+'" data-i="'+i+'"'+(st.beantwortet?' disabled':'')+'>'
        +'<div class="ans-inner"><span class="letter">'+letter+'</span>'
        +'<span class="txt">'+opts[i]+'</span>'+mark+'</div></button>';
    }
    html+='</div>';

    // Feedback
    if(st.beantwortet){
      var ok=(st.selected===frage.richtig);
      var ftitle=ok?("Richtig! +CHF "+chf(BETRAG[fIndex]))
        :"Leider falsch – diese Frage kommt später nochmals.";
      html+='<div class="feedback '+(ok?"ok":"no")+'">'
        +'<div class="ftitle">'+ftitle+'</div>'
        +'<p>'+frage.erklaerung+'</p></div>';
      var btnLabel = (st.pos===st.runde.length-1)
        ? (st.falsche.length===0?"Auswertung anzeigen":"Runde abschliessen")
        : "Nächste Frage";
      html+='<button class="btn-gold" id="weiter">'+btnLabel+'</button>';
    }

    html+='</div>'; // main
    html+=ladderHTML(fIndex);
    html+='</div>'; // row
  }

  else if(st.phase==="rundenende"){
    var n=st.falsche.length;
    html+='<div class="panel" style="border-color:rgba(251,191,36,.3);">'
      +'<div class="panel-icon" style="background:linear-gradient(180deg,#f6b13c,#d98512);">'
      +'<span style="width:28px;height:28px;color:#1a1100;">'+ICON.repeat+'</span></div>'
      +'<h2>'+(n===1?"Noch 1 Frage offen":("Noch "+n+" Fragen offen"))+'</h2>'
      +'<div class="sub">Diese Fragen waren noch nicht richtig. Sie kommen jetzt nochmals – bis alle sitzen.</div>'
      +'<div class="openlist">';
    for(var f=0;f<st.falsche.length;f++){
      var fi=st.falsche[f];
      html+='<div class="item"><span>'+QUESTIONS[fi].frage+'</span>'
        +'<span class="b">CHF '+chf(BETRAG[fi])+'</span></div>';
    }
    html+='</div><button class="btn-gold" id="wiederhol">Wiederholungsrunde starten</button></div>';
  }

  else if(st.phase==="fertig"){
    html+='<div class="panel" style="border-color:rgba(251,191,36,.4);">'
      +'<div class="panel-icon" style="width:64px;height:64px;'
      +'background:linear-gradient(180deg,#f7c64e,#dd9018);'
      +'filter:drop-shadow(0 0 16px rgba(246,177,60,.7));">'
      +'<span style="width:36px;height:36px;color:#1a1100;">'+ICON.trophy+'</span></div>'
      +'<h2 class="win">Gewonnen!</h2>'
      +'<div class="sub">Alle 12 Fragen richtig beantwortet. '+noteText()+'</div>'
      +'<div class="resultbox"><div class="big">'
      +'<span style="width:24px;height:24px;color:#fcd34d;">'+ICON.coins+'</span>'
      +'<span class="amt">CHF '+chf(GESAMT)+'</span></div>'
      +'<div class="cap">Gesamtgewinn</div>'
      +'<div class="meta">'+st.erstePunkte+' / '+QUESTIONS.length+' richtig im ersten Anlauf · '
      +(st.rundeNr===1?"ohne Wiederholung":(st.rundeNr+" Durchgänge gespielt"))+'</div></div>'
      +'<button class="btn-gold" id="neustart">'
      +'<span style="width:16px;height:16px;">'+ICON.rotate+'</span>Neue Runde spielen</button></div>';
  }

  app.innerHTML=html;

  // Listener
  var ansBtns=app.querySelectorAll(".ans[data-i]");
  for(var a=0;a<ansBtns.length;a++){
    (function(btn){ btn.onclick=function(){ waehlen(+btn.dataset.i); }; })(ansBtns[a]);
  }
  var jk=document.getElementById("joker"); if(jk) jk.onclick=jokerNutzen;
  var wb=document.getElementById("weiter"); if(wb) wb.onclick=weiter;
  var wh=document.getElementById("wiederhol"); if(wh) wh.onclick=wiederholungStarten;
  var ns=document.getElementById("neustart"); if(ns) ns.onclick=neustart;
}

initState();
render();
</script>
</body>
</html>
