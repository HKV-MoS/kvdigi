<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Badi-Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#163C4A;
    --done:#37B985;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{min-height:100%;}
  body{
    font-family:'Nunito',sans-serif;color:var(--ink);
    background:linear-gradient(180deg,#BCE8F6 0%,#7FD2E8 42%,#39B0D4 100%);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;padding:34px 18px 60px;
  }
  .wrap{max-width:560px;margin:0 auto;}

  /* Header */
  header{text-align:center;position:relative;margin-bottom:22px;}
  .sun{width:54px;height:54px;margin:0 auto 10px;position:relative;}
  .sun-core{position:absolute;inset:14px;background:#FFD23F;border-radius:50%;
    box-shadow:0 0 0 4px rgba(255,210,63,.35);}
  .ray{position:absolute;left:50%;top:50%;width:5px;height:11px;background:#FFD23F;
    border-radius:3px;transform-origin:2.5px 27px;}
  h1{font-family:'Fredoka',sans-serif;font-weight:700;font-size:2.7rem;line-height:1;
    color:#fff;letter-spacing:.01em;text-shadow:0 3px 0 rgba(22,60,74,.18);}
  .sub{font-weight:700;color:#fff;opacity:.95;margin-top:6px;font-size:1.02rem;}

  /* Progress */
  .progress{background:#fff;border-radius:18px;padding:15px 18px;margin-bottom:18px;
    box-shadow:0 8px 22px rgba(22,60,74,.16);}
  .progress-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px;}
  .progress-top b{font-family:'Fredoka',sans-serif;font-size:1.05rem;}
  .progress-top span{font-weight:800;color:#39B0D4;}
  .track{height:13px;background:#E6F4F8;border-radius:8px;overflow:hidden;}
  .fill{height:100%;width:0;border-radius:8px;
    background:linear-gradient(90deg,#FFD23F,#FF8A5B,#37B985);transition:width .4s ease;}

  /* Challenge cards */
  .list{display:flex;flex-direction:column;gap:11px;}
  .card{display:flex;align-items:center;gap:14px;background:#fff;border-radius:18px;
    padding:13px 15px;cursor:pointer;box-shadow:0 6px 16px rgba(22,60,74,.13);
    border:2.5px solid transparent;transition:transform .15s ease,box-shadow .15s ease,
    background .2s ease,border-color .2s ease;}
  .card:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(22,60,74,.2);}
  .card:has(.chk:checked){background:#EBFAF3;border-color:var(--done);}

  .badge{width:50px;height:50px;border-radius:14px;flex:none;display:grid;place-items:center;
    color:#fff;transition:transform .2s ease;}
  .card:has(.chk:checked) .badge{transform:rotate(-6deg) scale(.94);}
  .badge svg{width:27px;height:27px;}
  .badge .num{font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.5rem;}

  .body{flex:1;min-width:0;}
  .title{font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.12rem;line-height:1.2;}
  .note{font-size:.86rem;font-weight:600;color:#6E8A93;margin-top:1px;}
  .card:has(.chk:checked) .note{color:var(--done);}

  .chk{position:absolute;opacity:0;pointer-events:none;}
  .box{width:32px;height:32px;flex:none;border-radius:10px;border:3px solid #CFE6EC;
    background:#fff;display:grid;place-items:center;transition:all .2s ease;}
  .box svg{width:18px;height:18px;stroke:#fff;stroke-width:3.5;fill:none;
    stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.4);
    transition:all .2s ease;}
  .card:has(.chk:checked) .box{background:var(--done);border-color:var(--done);}
  .card:has(.chk:checked) .box svg{opacity:1;transform:scale(1);}

  /* Celebration */
  .party{margin-top:20px;background:#fff;border-radius:18px;padding:20px;text-align:center;
    box-shadow:0 8px 22px rgba(22,60,74,.16);display:none;}
  .party.show{display:block;animation:pop .45s ease;}
  @keyframes pop{from{transform:scale(.85);opacity:0;}to{transform:scale(1);opacity:1;}}
  .party b{font-family:'Fredoka',sans-serif;font-size:1.3rem;display:block;}
  .party span{font-weight:700;color:#6E8A93;}

  footer{text-align:center;margin-top:24px;color:#fff;font-weight:700;
    font-size:.82rem;opacity:.9;}

  @media print{
    body{background:#fff;padding:14px;}
    h1,.sub,footer{color:var(--ink);text-shadow:none;}
    .progress,.party,.sun{display:none;}
    .card{box-shadow:none;border:2px solid #CFE6EC;break-inside:avoid;}
    .card:hover{transform:none;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="sun" id="sun"><div class="sun-core"></div></div>
    <h1>Badi-Challenge</h1>
    <p class="sub">10 Aufgaben &ndash; schaffst du alle?</p>
  </header>

  <div class="progress">
    <div class="progress-top"><b>Dein Fortschritt</b><span><i id="count">0</i> von 10</span></div>
    <div class="track"><div class="fill" id="bar"></div></div>
  </div>

  <div class="list">

    <label class="card">
      <span class="badge" style="background:#FFD23F"><span class="num">1</span></span>
      <span class="body"><span class="title">1-Meter-Brett</span><span class="note">der Einstieg</span></span>
      <input type="checkbox" class="chk">
      <span class="box"><svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6"/></svg></span>
    </label>

    <label class="card">
      <span class="badge" style="background:#FF8A5B"><span class="num">3</span></span>
      <span class="body"><span class="title">3-Meter-Brett</span><span class="note">schon mutiger</span></span>
      <input type="checkbox" class="chk">
      <span class="box"><svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6"/></svg></span>
    </label>

    <label class="card">
      <span class="badge" style="background:#FF5C7A"><span class="num">5</span></span>
      <span class="body"><span class="title">5-Meter-Turm</span><span class="note">die K&ouml;nigsdisziplin</span></span>
      <input type="checkbox" class="chk">
      <span class="box"><svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6"/></svg></span>
    </label>

    <label class="card">
      <span class="badge" style="background:#5EC5E0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v9"/><path d="M6 6c9 0 5 14 14 15"/><path d="M3 7h6M3 10h6"/></svg></span>
      <span class="body"><span class="title">Wasserrutschbahn</span><span class="note">einmal runtersausen</span></span>
      <input type="checkbox" class="chk">
      <span class="box"><svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6"/></svg></span>
    </label>

    <label class="card">
      <span class="badge" style="background:#6BCB77"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="5.5"/><line x1="13" y1="13" x2="18" y2="18"/><circle cx="18" cy="7" r="1.6" fill="currentColor"/></svg></span>
      <span class="body"><span class="title">Tischtennis-Rundlauf</span><span class="note">einmal mitspielen</span></span>
      <input type="checkbox" class="chk">
      <span class="box"><svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6"/></svg></span>
    </label>

    <label class="card">
      <span class="badge" style="background:#F4A340"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><polyline points="18 2 18 7 13 7"/></svg></span>
      <span class="body"><span class="title">Sandrolle</span><span class="note">nass werden, im Sand panieren &ndash; danach duschen vor dem Becken!</span></span>
      <input type="checkbox" class="chk">
      <span class="box"><svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6"/></svg></span>
    </label>

    <label class="card">
      <span class="badge" style="background:#9B7EDE"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="11" r="2.3"/><circle cx="12" cy="5" r="2.3"/><circle cx="18" cy="11" r="2.3"/><path d="M5 17c1 2.5 3 2.5 4 0M15 17c1 2.5 3 2.5 4 0"/></svg></span>
      <span class="body"><span class="title">20&times; Jonglieren</span><span class="note">ohne Fallenlassen</span></span>
      <input type="checkbox" class="chk">
      <span class="box"><svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6"/></svg></span>
    </label>

    <label class="card">
      <span class="badge" style="background:#2BB3A3"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="5" r="2.2"/><path d="M11 7.2v5M11 9l-3-2M11 9l3 2M11 12.2l-2 4M11 12.2l2 3"/><path d="M3 20c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/></svg></span>
      <span class="body"><span class="title">Sprung ab em B&ouml;ckli</span><span class="note">ab ins Wasser!</span></span>
      <input type="checkbox" class="chk">
      <span class="box"><svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6"/></svg></span>
    </label>

    <label class="card">
      <span class="badge" style="background:#2F80C8"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="7" r="2"/><path d="M4 13c2-1.6 4-1.6 6 0 1.8 1.4 3.6 1.2 5.5-1L18 9"/><path d="M3 19c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/></svg></span>
      <span class="body"><span class="title">1 L&auml;nge schwimmen</span><span class="note">die ganze Bahn im 50-Meter-Becken</span></span>
      <input type="checkbox" class="chk">
      <span class="box"><svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6"/></svg></span>
    </label>

    <label class="card">
      <span class="badge" style="background:#6C7BC4"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16h9l8-8"/><path d="M5 16l-1 4M11 16l1 4"/></svg></span>
      <span class="body"><span class="title">5 Minuten nichts tun</span><span class="note">liegen, abschalten &ndash; auch kein Handy</span></span>
      <input type="checkbox" class="chk">
      <span class="box"><svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6"/></svg></span>
    </label>

  </div>

  <div class="party" id="party">
    <b>&#127881; Alle 10 geschafft!</b>
    <span>Du bisch en richtige Badi-Held.</span>
  </div>

  <footer>Sportunterricht &middot; HKV Aarau</footer>

</div>

<script>
  // Sonnenstrahlen erzeugen
  const sun=document.getElementById('sun');
  for(let i=0;i<8;i++){
    const r=document.createElement('div');
    r.className='ray';
    r.style.transform='translate(-50%,-50%) rotate('+(i*45)+'deg)';
    sun.appendChild(r);
  }
  // Fortschritt
  const boxes=document.querySelectorAll('.chk');
  const count=document.getElementById('count');
  const bar=document.getElementById('bar');
  const party=document.getElementById('party');
  function update(){
    const done=[...boxes].filter(b=>b.checked).length;
    count.textContent=done;
    bar.style.width=(done/boxes.length*100)+'%';
    party.classList.toggle('show',done===boxes.length);
  }
  boxes.forEach(b=>b.addEventListener('change',update));
  update();
</script>
</body>
</html>
