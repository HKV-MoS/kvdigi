<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stoppuhr – 5 Minuten</title>
<style>
  :root{
    --brass-d:#8a6d1b; --brass-m:#caa23f; --brass-l:#f3dd95; --ink:#2b2620;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    background:radial-gradient(closest-side at 50% 42%, #ffffff 0%, #eef0f2 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; padding:14px; color:var(--ink);
  }
  .watch-wrap{ width:min(70vh, 86vw); max-width:460px; line-height:0;
    filter:drop-shadow(0 16px 26px rgba(60,45,10,.28));
    transition:transform .25s ease; }
  .watch-wrap.done{ animation:ring 1.1s ease-in-out 0s 3; }
  @keyframes ring{
    0%,100%{ transform:rotate(0); }
    20%{ transform:rotate(-2.2deg) scale(1.012); }
    40%{ transform:rotate(2.2deg) scale(1.012); }
    60%{ transform:rotate(-1.6deg); }
    80%{ transform:rotate(1.6deg); }
  }
  svg{ width:100%; height:auto; display:block; }
  #crown{ cursor:pointer; }
  .controls{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:center; }
  button{ font-family:inherit; cursor:pointer; border:0; }
  .btn{
    font-size:16px; font-weight:700; letter-spacing:.2px; color:#3a2f10;
    padding:11px 20px; border-radius:12px;
    background:linear-gradient(#fbe9a8,#d9b24a 60%,#b88f2c);
    border:1px solid #9a7a22;
    box-shadow:0 2px 0 #8a6d1b, 0 5px 11px rgba(120,90,20,.32), inset 0 1px 0 rgba(255,255,255,.55);
    transition:transform .08s, box-shadow .08s, filter .12s;
  }
  .btn:hover{ filter:brightness(1.05); }
  .btn:active{ transform:translateY(2px); box-shadow:0 1px 0 #8a6d1b, 0 2px 6px rgba(120,90,20,.3), inset 0 1px 0 rgba(255,255,255,.5); }
  .btn.primary{ font-size:17px; padding:12px 26px;
    background:linear-gradient(#f6d56a,#caa23f 60%,#a9831f); }
  .btn:disabled{ filter:grayscale(.5) brightness(.95); opacity:.6; cursor:default; box-shadow:none; transform:none; }
  .btn-ghost{
    background:#fff; border:1.5px solid #d9cba0; color:#6b5a22; font-weight:700;
    box-shadow:0 1px 3px rgba(120,90,20,.14); font-size:15px; padding:10px 16px; border-radius:11px;
  }
  .btn-ghost:hover{ border-color:#b8973c; background:#fffdf5; }
  .row2{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:center; }
  .presets{ display:flex; gap:6px; align-items:center; }
  .chip{
    font-size:13px; font-weight:700; color:#6b5a22; background:#fff;
    border:1.5px solid #e0d3aa; border-radius:999px; padding:6px 13px; cursor:pointer;
    transition:all .12s;
  }
  .chip:hover{ border-color:#b8973c; }
  .chip.on{ background:#caa23f; color:#fff; border-color:#a9831f; box-shadow:0 1px 4px rgba(150,110,20,.4); }
  .mute{ width:40px; height:40px; border-radius:50%; font-size:18px; line-height:1;
    background:#fff; border:1.5px solid #e0d3aa; color:#6b5a22; display:grid; place-items:center; }
  .mute:hover{ border-color:#b8973c; }
  .lbl{ font-size:12px; color:#8a7c55; font-weight:600; }
  .credit{ font-size:11px; color:#a99f86; text-align:center; line-height:1.4; margin-top:2px; }
</style>
</head>
<body>

<div class="watch-wrap" id="wrap">
  <svg viewBox="0 0 420 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stoppuhr">
    <defs>
      <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#fbe9a8"/>
        <stop offset="0.45" stop-color="#d9b24a"/>
        <stop offset="0.7" stop-color="#a9831f"/>
        <stop offset="1" stop-color="#caa23f"/>
      </linearGradient>
      <radialGradient id="dial" cx="0.5" cy="0.42" r="0.62">
        <stop offset="0" stop-color="#fffdf4"/>
        <stop offset="0.7" stop-color="#f7efd8"/>
        <stop offset="1" stop-color="#e9ddbe"/>
      </radialGradient>
      <linearGradient id="hand" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#c0392b"/>
        <stop offset="1" stop-color="#7d2018"/>
      </linearGradient>
    </defs>

    <!-- Bügel / Krone -->
    <g id="crown">
      <circle cx="210" cy="26" r="15" fill="none" stroke="url(#brass)" stroke-width="7"/>
      <rect x="201" y="38" width="18" height="16" rx="4" fill="url(#brass)" stroke="#8a6d1b" stroke-width="1"/>
      <rect x="194" y="52" width="32" height="22" rx="6" fill="url(#brass)" stroke="#8a6d1b" stroke-width="1.2"/>
      <g stroke="#8a6d1b" stroke-width="1.1" opacity="0.6">
        <line x1="200" y1="55" x2="200" y2="71"/>
        <line x1="206" y1="55" x2="206" y2="71"/>
        <line x1="212" y1="55" x2="212" y2="71"/>
        <line x1="218" y1="55" x2="218" y2="71"/>
      </g>
    </g>

    <!-- Gehäuse -->
    <circle cx="210" cy="272" r="192" fill="url(#brass)"/>
    <circle cx="210" cy="272" r="192" fill="none" stroke="#7a5f17" stroke-width="2"/>
    <circle cx="210" cy="272" r="176" fill="none" stroke="#fff2c4" stroke-width="2" opacity="0.7"/>
    <circle cx="210" cy="272" r="168" fill="#7a5f17"/>
    <!-- Zifferblatt -->
    <circle cx="210" cy="272" r="162" fill="url(#dial)"/>
    <!-- Guilloché-Andeutung -->
    <g fill="none" stroke="#e7dcc0" stroke-width="1" opacity="0.8">
      <circle cx="210" cy="272" r="64"/>
      <circle cx="210" cy="272" r="92"/>
      <circle cx="210" cy="272" r="120"/>
    </g>

    <!-- Faden-Spur (voller Ring) -->
    <circle cx="210" cy="272" r="150" fill="none" stroke="#e7ddc4" stroke-width="12"/>
    <!-- Restzeit-Ring (schrumpft) -->
    <path id="remainArc" d="M 210 122 A 150 150 0 1 1 210 422 A 150 150 0 1 1 210 122 Z"
          fill="none" stroke="#2f9e44" stroke-width="12" stroke-linecap="round"/>

    <!-- Skalenstriche -->
    <g id="ticks"></g>
    <!-- Ziffern -->
    <g id="nums" fill="#6b5a32" font-family="Georgia,'Times New Roman',serif" font-size="17" text-anchor="middle"></g>

    <!-- roter Index oben -->
    <polygon points="210,118 204,131 216,131" fill="#c0392b"/>

    <!-- Beschriftung -->
    <text x="210" y="232" text-anchor="middle" fill="#a9925a" font-family="Georgia,serif"
          font-size="13" letter-spacing="3">STOPPUHR</text>

    <!-- grosse Restzeit -->
    <text id="digit" x="210" y="320" text-anchor="middle" fill="#2b2620"
          font-family="Arial,Helvetica,sans-serif" font-size="62" font-weight="700"
          style="font-variant-numeric:tabular-nums;letter-spacing:1px">05:00</text>
    <text id="doneLabel" x="210" y="360" text-anchor="middle" fill="#c0392b"
          font-family="Georgia,serif" font-size="22" font-weight="700"
          letter-spacing="2" opacity="0" style="text-transform:uppercase">Zeit um!</text>

    <!-- Zeiger -->
    <g id="handG" transform="rotate(0 210 272)">
      <polygon points="210,138 205,278 215,278" fill="url(#hand)"/>
      <polygon points="210,300 206,272 214,272" fill="#7d2018"/>
    </g>
    <circle cx="210" cy="272" r="11" fill="#caa23f" stroke="#7a5f17" stroke-width="2"/>
    <circle cx="210" cy="272" r="4" fill="#5b4712"/>
  </svg>
</div>

<div class="controls">
  <button class="btn primary" id="startBtn">▶&nbsp; Start</button>
  <button class="btn-ghost" id="resetBtn">↺&nbsp; Zurücksetzen</button>
</div>

<div class="row2">
  <span class="lbl">Dauer:</span>
  <div class="presets" id="presets">
    <button class="chip" data-min="1">1 Min</button>
    <button class="chip" data-min="3">3 Min</button>
    <button class="chip on" data-min="5">5 Min</button>
    <button class="chip" data-min="10">10 Min</button>
  </div>
  <button class="mute" id="muteBtn" title="Ton ein/aus">🔔</button>
</div>

<div class="credit">© 2026 Samuel Mollet · HKV Aarau · realisiert mit Claude (Anthropic)<br>
Leertaste = Start/Pause · R = Zurücksetzen · Klick auf die Krone = Start/Pause</div>

<script>
(function(){
  var CX=210, CY=272, R=150;
  var ring=document.getElementById('remainArc');
  var handG=document.getElementById('handG');
  var digit=document.getElementById('digit');
  var doneLabel=document.getElementById('doneLabel');
  var wrap=document.getElementById('wrap');
  var startBtn=document.getElementById('startBtn');
  var resetBtn=document.getElementById('resetBtn');
  var muteBtn=document.getElementById('muteBtn');
  var crown=document.getElementById('crown');

  // Skalenstriche + Ziffern (0–60 Sekunden-Optik, dekorativ)
  (function(){
    var t='', n='';
    for(var i=0;i<60;i++){
      var a=i*6*Math.PI/180;
      var major=(i%5===0);
      var r1=major?134:140, r2=148, w=major?2.4:1;
      var x1=CX+r1*Math.sin(a), y1=CY-r1*Math.cos(a);
      var x2=CX+r2*Math.sin(a), y2=CY-r2*Math.cos(a);
      t+='<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" stroke="#8a7034" stroke-width="'+w+'"/>';
    }
    for(var s=5;s<=60;s+=5){
      var av=s*6*Math.PI/180, rr=118;
      var xv=CX+rr*Math.sin(av), yv=CY-rr*Math.cos(av)+6;
      n+='<text x="'+xv.toFixed(1)+'" y="'+yv.toFixed(1)+'">'+s+'</text>';
    }
    document.getElementById('ticks').innerHTML=t;
    document.getElementById('nums').innerHTML=n;
  })();

  var durationMs=5*60000;
  var remainingMs=durationMs;
  var running=false, endTime=0, raf=0;
  var muted=false, actx=null, lastSec=null, ended=false;

  function pad(x){ return (x<10?'0':'')+x; }
  function fmt(ms){ var s=Math.max(0,Math.ceil(ms/1000)); return pad(Math.floor(s/60))+':'+pad(s%60); }
  function pt(a){ var r=a*Math.PI/180; return [CX+R*Math.sin(r), CY-R*Math.cos(r)]; }
  function arcPath(startA,endA){
    var s=pt(startA), e=pt(endA), large=(endA-startA)>180?1:0;
    return 'M '+s[0].toFixed(1)+' '+s[1].toFixed(1)+' A '+R+' '+R+' 0 '+large+' 1 '+e[0].toFixed(1)+' '+e[1].toFixed(1);
  }
  var FULL='M 210 122 A 150 150 0 1 1 210 422 A 150 150 0 1 1 210 122 Z';

  function draw(){
    var p=durationMs>0 ? (1 - remainingMs/durationMs) : 1;
    if(p<0)p=0; if(p>1)p=1;
    var ang=p*360;
    handG.setAttribute('transform','rotate('+ang.toFixed(2)+' '+CX+' '+CY+')');
    var f=1-p;
    if(f>=0.9995) ring.setAttribute('d',FULL);
    else if(f<=0.0008) ring.setAttribute('d','');
    else ring.setAttribute('d',arcPath(ang,360));
    var secs=remainingMs/1000;
    ring.setAttribute('stroke', secs<=10 ? '#e03131' : secs<=60 ? '#f08c00' : '#2f9e44');
    digit.textContent=fmt(remainingMs);
    digit.setAttribute('fill', secs<=10 ? '#c0392b' : '#2b2620');
  }

  function updateBtns(){
    startBtn.innerHTML = running ? '⏸&nbsp; Pause' : '▶&nbsp; Start';
    startBtn.disabled = (!running && remainingMs<=0);
  }

  function loop(){
    remainingMs = endTime - performance.now();
    if(remainingMs<=0){ remainingMs=0; draw(); onEnd(); return; }
    draw();
    var sec=Math.ceil(remainingMs/1000);
    if(sec!==lastSec){ lastSec=sec; if(sec<=5 && sec>0) tick(); }
    raf=requestAnimationFrame(loop);
  }

  function start(){
    if(remainingMs<=0) return;
    running=true; ended=false; ensureAudio();
    wrap.classList.remove('done'); doneLabel.setAttribute('opacity','0');
    endTime=performance.now()+remainingMs;
    cancelAnimationFrame(raf); raf=requestAnimationFrame(loop);
    updateBtns();
  }
  function pause(){
    running=false; cancelAnimationFrame(raf);
    remainingMs=Math.max(0,endTime-performance.now());
    updateBtns();
  }
  function toggle(){ running?pause():start(); }
  function reset(){
    running=false; cancelAnimationFrame(raf);
    remainingMs=durationMs; lastSec=null; ended=false;
    wrap.classList.remove('done'); doneLabel.setAttribute('opacity','0');
    draw(); updateBtns();
  }
  function setDur(min){
    durationMs=min*60000;
    running=false; cancelAnimationFrame(raf);
    remainingMs=durationMs; lastSec=null; ended=false;
    wrap.classList.remove('done'); doneLabel.setAttribute('opacity','0');
    draw(); updateBtns();
  }
  function onEnd(){
    running=false; cancelAnimationFrame(raf);
    if(!ended){ ended=true; alarm(); }
    doneLabel.setAttribute('opacity','1');
    wrap.classList.add('done');
    updateBtns();
  }

  // ----- Ton -----
  function ensureAudio(){
    if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ actx=null; } }
    if(actx && actx.state==='suspended'){ actx.resume(); }
  }
  function ping(freq,dur,when,vol,type){
    if(muted||!actx) return;
    var t=actx.currentTime+(when||0);
    var o=actx.createOscillator(), g=actx.createGain();
    o.type=type||'sine'; o.frequency.value=freq;
    o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||0.3,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.start(t); o.stop(t+dur+0.03);
  }
  function tick(){ ping(1300,0.05,0,0.12,'square'); }
  function alarm(){
    if(muted||!actx) return;
    var seq=[880,1175,880,1175,1320];
    for(var i=0;i<seq.length;i++){
      ping(seq[i],0.5,i*0.34,0.32,'sine');
      ping(seq[i]*2,0.4,i*0.34,0.10,'sine');
    }
  }

  // ----- Events -----
  startBtn.addEventListener('click', toggle);
  resetBtn.addEventListener('click', reset);
  crown.addEventListener('click', toggle);
  muteBtn.addEventListener('click', function(){
    muted=!muted; muteBtn.textContent=muted?'🔕':'🔔';
    muteBtn.title=muted?'Ton aus (klicken für ein)':'Ton ein (klicken für aus)';
    if(!muted) ensureAudio();
  });
  document.querySelectorAll('.chip').forEach(function(c){
    c.addEventListener('click', function(){
      document.querySelectorAll('.chip').forEach(function(x){ x.classList.remove('on'); });
      c.classList.add('on');
      setDur(parseInt(c.dataset.min,10));
    });
  });
  document.addEventListener('keydown', function(e){
    if(e.code==='Space'){ e.preventDefault(); toggle(); }
    else if(e.key==='r'||e.key==='R'){ reset(); }
  });

  draw(); updateBtns();
})();
</script>
</body>
</html>
