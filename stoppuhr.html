<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stoppuhr – 5 Minuten</title>
<style>
  :root{ --ink:#2b2620; }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    background:radial-gradient(closest-side at 50% 42%, #ffffff 0%, #e9ebee 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:8px; padding:10px; color:var(--ink);
  }
  .scene{ perspective:1400px; width:min(140px,92vw); display:flex; justify-content:center; position:relative; }
  .shadow{
    position:absolute; bottom:-6%; left:50%; width:62%; height:11%;
    transform:translateX(-50%);
    background:radial-gradient(ellipse at center, rgba(60,45,10,.38) 0%, rgba(60,45,10,0) 70%);
    filter:blur(3px); z-index:0; pointer-events:none;
  }
  .tilt{ width:100%; z-index:1; }
  .watch-wrap{ width:100%; line-height:0; transform-style:preserve-3d;
    filter:drop-shadow(0 20px 28px rgba(60,45,10,.32)); }
  .watch-wrap.done{ animation:ring 1.1s ease-in-out 0s 3; }
  @keyframes ring{
    0%,100%{ transform:rotate(0); }
    20%{ transform:rotate(-2.4deg); } 40%{ transform:rotate(2.4deg); }
    60%{ transform:rotate(-1.6deg); } 80%{ transform:rotate(1.6deg); }
  }
  svg{ width:100%; height:auto; display:block; }
  #crown{ cursor:pointer; }
  .controls{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:center; }
  button{ font-family:inherit; cursor:pointer; border:0; }
  .btn{
    font-size:16px; font-weight:700; color:#3a2f10; padding:11px 20px; border-radius:12px;
    background:linear-gradient(#fbe9a8,#d9b24a 60%,#b88f2c); border:1px solid #9a7a22;
    box-shadow:0 2px 0 #8a6d1b, 0 5px 11px rgba(120,90,20,.32), inset 0 1px 0 rgba(255,255,255,.55);
    transition:transform .08s, box-shadow .08s, filter .12s;
  }
  .btn:hover{ filter:brightness(1.05); }
  .btn:active{ transform:translateY(2px); box-shadow:0 1px 0 #8a6d1b, 0 2px 6px rgba(120,90,20,.3), inset 0 1px 0 rgba(255,255,255,.5); }
  .btn.primary{ font-size:17px; padding:12px 26px; background:linear-gradient(#f6d56a,#caa23f 60%,#a9831f); }
  .btn:disabled{ filter:grayscale(.5) brightness(.95); opacity:.6; cursor:default; box-shadow:none; transform:none; }
  .btn-ghost{ background:#fff; border:1.5px solid #d9cba0; color:#6b5a22; font-weight:700;
    box-shadow:0 1px 3px rgba(120,90,20,.14); font-size:15px; padding:10px 16px; border-radius:11px; }
  .btn-ghost:hover{ border-color:#b8973c; background:#fffdf5; }
  .row2{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:center; }
  .presets{ display:flex; gap:6px; align-items:center; }
  .chip{ font-size:13px; font-weight:700; color:#6b5a22; background:#fff;
    border:1.5px solid #e0d3aa; border-radius:999px; padding:6px 13px; cursor:pointer; transition:all .12s; }
  .chip:hover{ border-color:#b8973c; }
  .chip.on{ background:#caa23f; color:#fff; border-color:#a9831f; box-shadow:0 1px 4px rgba(150,110,20,.4); }
  .toggle{ font-size:13px; font-weight:700; color:#6b5a22; background:#fff;
    border:1.5px solid #e0d3aa; border-radius:999px; padding:6px 13px; cursor:pointer; transition:all .12s; }
  .toggle:hover{ border-color:#b8973c; }
  .toggle.on{ background:#3f7d4e; color:#fff; border-color:#2f6a3e; box-shadow:0 1px 4px rgba(40,90,50,.35); }
  .toggle.off{ color:#9a8a6a; background:#f3f0e8; border-color:#ddd3bd; }
  .lbl{ font-size:12px; color:#8a7c55; font-weight:600; }
  .credit{ font-size:8.5px; color:#b3aa92; text-align:center; line-height:1.35; margin-top:2px; }
</style>
</head>
<body>

<div class="scene" id="scene">
  <div class="shadow"></div>
  <div class="tilt" id="tilt">
    <div class="watch-wrap" id="wrap">
      <svg viewBox="0 0 420 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stoppuhr">
        <defs>
          <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#fff3c8"/>
            <stop offset="0.32" stop-color="#e7c463"/>
            <stop offset="0.62" stop-color="#b8902f"/>
            <stop offset="1" stop-color="#6f5414"/>
          </linearGradient>
          <linearGradient id="brassFace" x1="0.1" y1="0" x2="0.9" y2="1">
            <stop offset="0" stop-color="#fff6d8"/>
            <stop offset="0.28" stop-color="#ecca6e"/>
            <stop offset="0.55" stop-color="#c89c36"/>
            <stop offset="0.8" stop-color="#9a7822"/>
            <stop offset="1" stop-color="#7a5d16"/>
          </linearGradient>
          <radialGradient id="dialG" cx="0.42" cy="0.36" r="0.72">
            <stop offset="0" stop-color="#fffdf5"/>
            <stop offset="0.55" stop-color="#f8f0da"/>
            <stop offset="0.85" stop-color="#efe3c2"/>
            <stop offset="1" stop-color="#ddcfa6"/>
          </radialGradient>
          <linearGradient id="handG2" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#d2442f"/>
            <stop offset="1" stop-color="#7d2018"/>
          </linearGradient>
          <radialGradient id="cap" cx="0.38" cy="0.34" r="0.8">
            <stop offset="0" stop-color="#ffe9a6"/>
            <stop offset="0.6" stop-color="#caa23f"/>
            <stop offset="1" stop-color="#7a5f17"/>
          </radialGradient>
          <radialGradient id="glass" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
            <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.12"/>
            <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
          </radialGradient>
          <clipPath id="dialClip"><circle cx="210" cy="272" r="160"/></clipPath>
        </defs>

        <!-- Krone / Bügel (3D) -->
        <g id="crown">
          <circle cx="210" cy="26" r="15" fill="none" stroke="url(#brass)" stroke-width="7"/>
          <rect x="201" y="38" width="18" height="16" rx="4" fill="url(#brass)" stroke="#7a5f17" stroke-width="1"/>
          <rect x="193" y="52" width="34" height="23" rx="6" fill="url(#brass)" stroke="#7a5f17" stroke-width="1.2"/>
          <g stroke="#6f5414" stroke-width="1.2" opacity="0.55">
            <line x1="199" y1="55" x2="199" y2="72"/><line x1="205" y1="55" x2="205" y2="72"/>
            <line x1="211" y1="55" x2="211" y2="72"/><line x1="217" y1="55" x2="217" y2="72"/>
            <line x1="223" y1="55" x2="223" y2="72"/>
          </g>
          <rect x="195" y="53" width="30" height="6" rx="3" fill="#fff6d8" opacity="0.5"/>
        </g>

        <!-- Gehäuse: gewölbter Rand -->
        <circle cx="210" cy="272" r="194" fill="#5b450f"/>
        <circle cx="210" cy="272" r="191" fill="url(#brassFace)"/>
        <circle cx="210" cy="272" r="191" fill="none" stroke="#5b450f" stroke-width="1.5"/>
        <!-- Glanz-Sichel oben links auf dem Rand -->
        <path d="M 78 168 A 180 180 0 0 1 300 96" fill="none" stroke="#fff7dd" stroke-width="7" stroke-linecap="round" opacity="0.75"/>
        <!-- Schatten unten rechts auf dem Rand -->
        <path d="M 350 372 A 180 180 0 0 1 132 446" fill="none" stroke="#4f3d0d" stroke-width="9" stroke-linecap="round" opacity="0.28"/>
        <circle cx="210" cy="272" r="171" fill="none" stroke="#fff2c4" stroke-width="2.5" opacity="0.65"/>
        <!-- recessierter Innenrand -->
        <circle cx="210" cy="272" r="166" fill="#6f5414"/>
        <circle cx="210" cy="272" r="163" fill="#3a2c0a" opacity="0.5"/>

        <!-- Zifferblatt -->
        <circle cx="210" cy="272" r="160" fill="url(#dialG)"/>
        <g id="rose" opacity="0.55"><circle cx="210" cy="272" r="106" fill="none" stroke="#c4ab6e" stroke-width="1.1"/><circle cx="210" cy="272" r="100" fill="none" stroke="#c4ab6e" stroke-width="0.7" opacity="0.55"/><polygon points="210.0,272.0 216.8,266.1 225.3,235.0" fill="#d3bd83"/><polygon points="210.0,272.0 209.4,263.1 225.3,235.0" fill="#a3854a"/><polygon points="210.0,272.0 218.9,272.6 247.0,256.7" fill="#d3bd83"/><polygon points="210.0,272.0 215.9,265.2 247.0,256.7" fill="#a3854a"/><polygon points="210.0,272.0 215.9,278.8 247.0,287.3" fill="#d3bd83"/><polygon points="210.0,272.0 218.9,271.4 247.0,287.3" fill="#a3854a"/><polygon points="210.0,272.0 209.4,280.9 225.3,309.0" fill="#d3bd83"/><polygon points="210.0,272.0 216.8,277.9 225.3,309.0" fill="#a3854a"/><polygon points="210.0,272.0 203.2,277.9 194.7,309.0" fill="#d3bd83"/><polygon points="210.0,272.0 210.6,280.9 194.7,309.0" fill="#a3854a"/><polygon points="210.0,272.0 201.1,271.4 173.0,287.3" fill="#d3bd83"/><polygon points="210.0,272.0 204.1,278.8 173.0,287.3" fill="#a3854a"/><polygon points="210.0,272.0 204.1,265.2 173.0,256.7" fill="#d3bd83"/><polygon points="210.0,272.0 201.1,272.6 173.0,256.7" fill="#a3854a"/><polygon points="210.0,272.0 210.6,263.1 194.7,235.0" fill="#d3bd83"/><polygon points="210.0,272.0 203.2,266.1 194.7,235.0" fill="#a3854a"/><polygon points="210.0,272.0 223.4,268.5 255.3,226.7" fill="#d3bd83"/><polygon points="210.0,272.0 213.5,258.6 255.3,226.7" fill="#a3854a"/><polygon points="210.0,272.0 213.5,285.4 255.3,317.3" fill="#d3bd83"/><polygon points="210.0,272.0 223.4,275.5 255.3,317.3" fill="#a3854a"/><polygon points="210.0,272.0 196.6,275.5 164.7,317.3" fill="#d3bd83"/><polygon points="210.0,272.0 206.5,285.4 164.7,317.3" fill="#a3854a"/><polygon points="210.0,272.0 206.5,258.6 164.7,226.7" fill="#d3bd83"/><polygon points="210.0,272.0 196.6,268.5 164.7,226.7" fill="#a3854a"/><polygon points="210.0,272.0 220.0,254.0 210.0,172.0" fill="#d3bd83"/><polygon points="210.0,272.0 200.0,254.0 210.0,172.0" fill="#a3854a"/><polygon points="210.0,272.0 228.0,282.0 310.0,272.0" fill="#d3bd83"/><polygon points="210.0,272.0 228.0,262.0 310.0,272.0" fill="#a3854a"/><polygon points="210.0,272.0 200.0,290.0 210.0,372.0" fill="#d3bd83"/><polygon points="210.0,272.0 220.0,290.0 210.0,372.0" fill="#a3854a"/><polygon points="210.0,272.0 192.0,262.0 110.0,272.0" fill="#d3bd83"/><polygon points="210.0,272.0 192.0,282.0 110.0,272.0" fill="#a3854a"/><circle cx="210" cy="272" r="9" fill="#b89540" stroke="#8a6d1b" stroke-width="0.8"/><circle cx="210" cy="272" r="4" fill="#7a5f17"/></g>

        <!-- Faden-Spur + Restzeit-Ring -->
        <circle cx="210" cy="272" r="150" fill="none" stroke="#e7ddc4" stroke-width="12"/>
        <path id="remainArc" d="M 210 122 A 150 150 0 1 1 210 422 A 150 150 0 1 1 210 122 Z"
              fill="none" stroke="#2f9e44" stroke-width="12" stroke-linecap="round"/>

        <g id="ticks"></g>
        <g id="nums" fill="#6b5a32" font-family="Georgia,'Times New Roman',serif" font-size="17" text-anchor="middle"></g>
        <polygon points="210,118 204,131 216,131" fill="#c0392b"/>

        <text id="digit" x="210" y="320" text-anchor="middle" fill="#2b2620"
              font-family="Arial,Helvetica,sans-serif" font-size="62" font-weight="700"
              style="font-variant-numeric:tabular-nums;letter-spacing:1px">05:00</text>
        <text id="doneLabel" x="210" y="360" text-anchor="middle" fill="#c0392b"
              font-family="Georgia,serif" font-size="22" font-weight="700" letter-spacing="2" opacity="0">ZEIT UM!</text>

        <!-- Zeiger mit Schatten -->
        <g id="handShadow" transform="rotate(0 210 272)" opacity="0.22">
          <polygon points="213,140 208,280 218,280" fill="#000000"/>
        </g>
        <g id="handG" transform="rotate(0 210 272)">
          <polygon points="210,138 205,278 215,278" fill="url(#handG2)"/>
          <polygon points="210,300 206,272 214,272" fill="#7d2018"/>
        </g>
        <circle cx="210" cy="272" r="11" fill="url(#cap)" stroke="#5b450f" stroke-width="1.5"/>
        <circle cx="210" cy="272" r="4" fill="#4a3a0e"/>

        <!-- Glasreflexion (nur oben links, lässt Anzeige frei) -->
        <g clip-path="url(#dialClip)">
          <ellipse cx="158" cy="196" rx="132" ry="86" fill="url(#glass)"/>
          <path d="M 96 168 A 150 150 0 0 1 286 130" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
        </g>
        <!-- Klickfläche zum Einstellen der Zeit -->
        <circle id="setarea" cx="210" cy="272" r="158" fill="transparent" style="cursor:pointer;touch-action:none"/>
      </svg>
    </div>
  </div>
</div>

<div class="controls">
  <button class="btn primary" id="startBtn">▶&nbsp; Start</button>
  <button class="btn-ghost" id="resetBtn">↺&nbsp; Zurücksetzen</button>
</div>

<div class="row2">
  <span class="lbl">Dauer:</span>
  <div class="presets" id="presets">
    <button class="chip" data-min="1">1</button>
    <button class="chip" data-min="3">3</button>
    <button class="chip on" data-min="5">5</button>
    <button class="chip" data-min="10">10</button>
    <span class="lbl">Min</span>
  </div>
  <button class="toggle on" id="tickBtn">🔊 Ticken</button>
</div>

<div class="credit">© 2026 Samuel Mollet · HKV Aarau · realisiert mit Claude (Anthropic)<br>
Klick ins Zifferblatt = Restzeit · Chips = Dauer · Leertaste/Krone = Start · R = Reset</div>

<script>
(function(){
  var CX=210, CY=272, R=150;
  var ring=document.getElementById('remainArc');
  var handG=document.getElementById('handG');
  var handShadow=document.getElementById('handShadow');
  var digit=document.getElementById('digit');
  var doneLabel=document.getElementById('doneLabel');
  var wrap=document.getElementById('wrap');
  var tilt=document.getElementById('tilt');
  var scene=document.getElementById('scene');
  var startBtn=document.getElementById('startBtn');
  var resetBtn=document.getElementById('resetBtn');
  var tickBtn=document.getElementById('tickBtn');
  var crown=document.getElementById('crown');
  var svg=document.querySelector('svg');
  var setarea=document.getElementById('setarea');

  (function(){
    var t='', n='';
    for(var i=0;i<60;i++){
      var a=i*6*Math.PI/180, major=(i%5===0);
      var r1=major?134:140, r2=148, w=major?2.4:1;
      t+='<line x1="'+(CX+r1*Math.sin(a)).toFixed(1)+'" y1="'+(CY-r1*Math.cos(a)).toFixed(1)+'" x2="'+(CX+r2*Math.sin(a)).toFixed(1)+'" y2="'+(CY-r2*Math.cos(a)).toFixed(1)+'" stroke="#8a7034" stroke-width="'+w+'"/>';
    }
    for(var s=5;s<=60;s+=5){
      var av=s*6*Math.PI/180, rr=118;
      n+='<text x="'+(CX+rr*Math.sin(av)).toFixed(1)+'" y="'+(CY-rr*Math.cos(av)+6).toFixed(1)+'">'+s+'</text>';
    }
    document.getElementById('ticks').innerHTML=t;
    document.getElementById('nums').innerHTML=n;
  })();

  var durationMs=5*60000, remainingMs=durationMs;
  var running=false, endTime=0, raf=0;
  var actx=null, lastSec=null, ended=false, tickFlip=false;
  var tickOn=true;

  function pad(x){ return (x<10?'0':'')+x; }
  function fmt(ms){ var s=Math.max(0,Math.ceil(ms/1000)); return pad(Math.floor(s/60))+':'+pad(s%60); }
  function pt(a){ var r=a*Math.PI/180; return [CX+R*Math.sin(r), CY-R*Math.cos(r)]; }
  function arcPath(s,e){ var p1=pt(s),p2=pt(e),lg=(e-s)>180?1:0;
    return 'M '+p1[0].toFixed(1)+' '+p1[1].toFixed(1)+' A '+R+' '+R+' 0 '+lg+' 1 '+p2[0].toFixed(1)+' '+p2[1].toFixed(1); }
  var FULL='M 210 122 A 150 150 0 1 1 210 422 A 150 150 0 1 1 210 122 Z';

  function draw(){
    var p=durationMs>0?(1-remainingMs/durationMs):1; if(p<0)p=0; if(p>1)p=1;
    var ang=p*360;
    handG.setAttribute('transform','rotate('+ang.toFixed(2)+' '+CX+' '+CY+')');
    handShadow.setAttribute('transform','rotate('+ang.toFixed(2)+' '+CX+' '+CY+')');
    var f=1-p;
    if(f>=0.9995) ring.setAttribute('d',FULL);
    else if(f<=0.0008) ring.setAttribute('d','');
    else ring.setAttribute('d',arcPath(ang,360));
    var secs=remainingMs/1000;
    ring.setAttribute('stroke', secs<=10?'#e03131':secs<=60?'#f08c00':'#2f9e44');
    digit.textContent=fmt(remainingMs);
    digit.setAttribute('fill', secs<=10?'#c0392b':'#2b2620');
  }
  function updateBtns(){
    startBtn.innerHTML = running?'⏸&nbsp; Pause':'▶&nbsp; Start';
    startBtn.disabled = (!running && remainingMs<=0);
  }
  function loop(){
    remainingMs=endTime-performance.now();
    if(remainingMs<=0){ remainingMs=0; draw(); onEnd(); return; }
    draw();
    var sec=Math.ceil(remainingMs/1000);
    if(sec!==lastSec){ lastSec=sec; tickFlip=!tickFlip; if(tickOn) playTick(sec<=3); }
    raf=requestAnimationFrame(loop);
  }
  function start(){
    if(remainingMs<=0) return;
    running=true; ended=false; ensureAudio();
    wrap.classList.remove('done'); doneLabel.setAttribute('opacity','0');
    endTime=performance.now()+remainingMs;
    cancelAnimationFrame(raf); raf=requestAnimationFrame(loop); updateBtns();
  }
  function pause(){ running=false; cancelAnimationFrame(raf); remainingMs=Math.max(0,endTime-performance.now()); updateBtns(); }
  function toggle(){ running?pause():start(); }
  function reset(){ running=false; cancelAnimationFrame(raf); remainingMs=durationMs; lastSec=null; ended=false;
    wrap.classList.remove('done'); doneLabel.setAttribute('opacity','0'); draw(); updateBtns(); }
  function setDur(min){ durationMs=min*60000; running=false; cancelAnimationFrame(raf); remainingMs=durationMs; lastSec=null; ended=false;
    wrap.classList.remove('done'); doneLabel.setAttribute('opacity','0'); draw(); updateBtns(); syncChips(min); }
  function syncChips(min){ document.querySelectorAll('.chip').forEach(function(x){ x.classList.toggle('on', parseInt(x.dataset.min,10)===min); }); }
  function onEnd(){ running=false; cancelAnimationFrame(raf);
    ended=true;
    doneLabel.setAttribute('opacity','1'); wrap.classList.add('done'); updateBtns(); }

  // ----- Ton -----
  function ensureAudio(){
    if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ actx=null; } }
    if(actx && actx.state==='suspended') actx.resume();
  }
  function blip(freq,dur,when,vol,type){
    if(!actx) return; var t=actx.currentTime+(when||0);
    var o=actx.createOscillator(), g=actx.createGain();
    o.type=type||'sine'; o.frequency.value=freq; o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.3,t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.start(t); o.stop(t+dur+0.03);
  }
  function playTick(urgent){
    if(!actx) return;
    var t=actx.currentTime;
    var isTock=tickFlip;                       // wechselt Tick/Tack (beide hoch)
    var vol=urgent?0.5:0.34;
    // sehr kurzer, heller Rausch-Knack — wie ein Fingernagel-Schnippen
    var dur=0.013, len=Math.max(1,Math.floor(actx.sampleRate*dur));
    var buf=actx.createBuffer(1,len,actx.sampleRate), d=buf.getChannelData(0);
    for(var i=0;i<len;i++){ d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.5); }
    var src=actx.createBufferSource(); src.buffer=buf;
    var bp=actx.createBiquadFilter(); bp.type='bandpass';
    bp.frequency.value=isTock?13000:15000; bp.Q.value=9;   // sehr hoch, schmalbandig (weniger Hi-Hat)
    var hp=actx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=9000;
    var gc=actx.createGain(); gc.gain.value=vol;
    src.connect(bp); bp.connect(hp); hp.connect(gc); gc.connect(actx.destination);
    src.start(t);
    // 2) ganz leises, hohes Schaben direkt hinter dem Knack (an/aus mit dem Ticken)
    var sdur=0.05, slen=Math.max(1,Math.floor(actx.sampleRate*sdur));
    var sbuf=actx.createBuffer(1,slen,actx.sampleRate), sd=sbuf.getChannelData(0);
    for(var j=0;j<slen;j++){
      var w=Math.sin(Math.PI*j/slen);                 // weicher Ein-/Ausklang (kein Klick)
      var rough=0.55+0.45*Math.sin(0.0114*j);         // leichte Körnung (Schab-Charakter)
      sd[j]=(Math.random()*2-1)*w*rough;
    }
    var ssrc=actx.createBufferSource(); ssrc.buffer=sbuf;
    var shp=actx.createBiquadFilter(); shp.type='highpass'; shp.frequency.value=7000;
    var sbpf=actx.createBiquadFilter(); sbpf.type='bandpass'; sbpf.frequency.value=9500; sbpf.Q.value=0.8;
    var sg=actx.createGain(); sg.gain.value=vol*0.14;   // ganz leise relativ zum Tick
    ssrc.connect(shp); shp.connect(sbpf); sbpf.connect(sg); sg.connect(actx.destination);
    ssrc.start(t+0.006);
  }

  // ----- Zeit per Klick/Ziehen aufs Zifferblatt einstellen -----
  function angleFromEvent(evt){
    var pt=svg.createSVGPoint(); pt.x=evt.clientX; pt.y=evt.clientY;
    var m=svg.getScreenCTM(); if(!m) return null;
    var loc=pt.matrixTransform(m.inverse());
    var dx=loc.x-CX, dy=loc.y-CY;
    if(Math.abs(dx)<0.01 && Math.abs(dy)<0.01) return null;
    var ang=Math.atan2(dx,-dy)*180/Math.PI;     // 0 = oben (12 Uhr), im Uhrzeigersinn
    if(ang<0) ang+=360;
    return ang;
  }
  function setFromEvent(evt){
    var ang=angleFromEvent(evt); if(ang===null) return;
    var frac=1-ang/360;                         // Restanteil: oben=voll, rechts=¾, unten=½, links=¼
    if(frac<0) frac=0; if(frac>1) frac=1;
    running=false; cancelAnimationFrame(raf);
    remainingMs=durationMs*frac; lastSec=null; ended=false;
    wrap.classList.remove('done'); doneLabel.setAttribute('opacity','0');
    draw(); updateBtns();
  }
  var setting=false;
  setarea.addEventListener('pointerdown', function(e){
    e.preventDefault(); setting=true;
    try{ setarea.setPointerCapture(e.pointerId); }catch(err){}
    setFromEvent(e);
  });
  setarea.addEventListener('pointermove', function(e){ if(setting) setFromEvent(e); });
  setarea.addEventListener('pointerup', function(e){ setting=false; try{ setarea.releasePointerCapture(e.pointerId); }catch(err){} });
  setarea.addEventListener('pointercancel', function(){ setting=false; });

  // ----- Events -----
  startBtn.addEventListener('click', toggle);
  resetBtn.addEventListener('click', reset);
  crown.addEventListener('click', toggle);
  tickBtn.addEventListener('click', function(){
    tickOn=!tickOn; tickBtn.classList.toggle('on',tickOn); tickBtn.classList.toggle('off',!tickOn);
    tickBtn.textContent=(tickOn?'🔊':'🔇')+' Ticken'; if(tickOn) ensureAudio();
  });
  document.querySelectorAll('.chip').forEach(function(c){
    c.addEventListener('click', function(){ setDur(parseInt(c.dataset.min,10)); });
  });
  document.addEventListener('keydown', function(e){
    if(e.code==='Space'){ e.preventDefault(); toggle(); }
    else if(e.key==='r'||e.key==='R'){ reset(); }
  });

  draw(); updateBtns();
})();
</script>
</body>
</html>
