// engine.js – Render-Engine + Navigation für T1 ABU-Lehrmittel KVdigital-Look
(function(){
  "use strict";
  var M = window.T1_MODULE || [];
  var state = { modul: -1, folie: 0 }; // modul -1 = Startseite

  var elTimeline = document.getElementById('timeline');
  var elContent  = document.getElementById('content');
  var elTabs     = document.getElementById('tabs');
  var elHeaderT  = document.getElementById('headerTitel');

  // ---- Helfer: alle Folien eines Moduls flach (inkl. Sektion-Info) ----
  function folienFlach(mod){
    var arr = [];
    mod.sektionen.forEach(function(sek){
      sek.folien.forEach(function(fol){
        arr.push({ sektion:sek, folie:fol });
      });
    });
    return arr;
  }

  // ================= BLOCK-RENDERER =================
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function renderListe(items){
    return '<ul>' + items.map(function(i){ return '<li>'+esc(i)+'</li>'; }).join('') + '</ul>';
  }
  function renderOl(items){
    return '<ol>' + items.map(function(i){ return '<li>'+esc(i)+'</li>'; }).join('') + '</ol>';
  }

  function renderBlock(b){
    switch(b.typ){
      case 'text':
        return '<p>'+esc(b.text)+'</p>';

      case 'lernziele':
        return '<div class="box box-lernziel">'
             + '<div class="box-titel">🎯 Lernziele</div>'
             + renderListe(b.items) + '</div>';

      case 'theorie':
        return '<div class="box box-theorie">'
             + '<div class="box-titel">'+esc(b.titel||'Theorie')+'</div>'
             + (b.text ? '<p>'+esc(b.text)+'</p>' : '')
             + (b.liste ? renderListe(b.liste) : '') + '</div>';

      case 'beispiel':
        return '<div class="box box-beispiel">'
             + '<div class="box-titel">💊 '+esc(b.titel||'Berufsbezug')+'</div>'
             + (b.text ? '<p>'+esc(b.text)+'</p>' : '')
             + (b.liste ? renderListe(b.liste) : '') + '</div>';

      case 'wichtig':
        return '<div class="box box-wichtig">'
             + '<div class="box-titel">⚠ '+esc(b.titel||'Wichtig')+'</div>'
             + (b.text ? '<p>'+esc(b.text)+'</p>' : '')
             + (b.liste ? renderListe(b.liste) : '') + '</div>';

      case 'aufgabe':
        var h = '<div class="box box-aufgabe">';
        h += '<div class="box-titel">📝 '+esc(b.titel||'Auftrag')+'</div>';
        if(b.meta) h += '<div class="box-meta">'+esc(b.meta)+'</div>';
        if(b.text) h += '<p>'+esc(b.text)+'</p>';
        if(b.liste) h += renderListe(b.liste);
        if(b.ol) h += renderOl(b.ol);
        h += '</div>';
        return h;

      case 'dialog':
        return '<p class="dialog"><span class="name">'+esc(b.name)+': </span>'
             + '<span class="text">«'+esc(b.text)+'»</span></p>';

      case 'tabelle':
        var t = '<table><thead><tr>';
        b.kopf.forEach(function(k){ t += '<th>'+esc(k)+'</th>'; });
        t += '</tr></thead><tbody>';
        b.zeilen.forEach(function(z){
          t += '<tr>';
          z.forEach(function(c){ t += '<td>'+esc(c)+'</td>'; });
          t += '</tr>';
        });
        t += '</tbody></table>';
        return t;

      case 'ix_luecke':
        var l = '<div class="box box-aufgabe">';
        l += '<div class="box-titel">✏️ Interaktion · '+esc(b.titel||'Lückentext')+'</div>';
        l += '<div class="ix-meta">Interaktionstyp: Lückentext – {{Lösung}}</div>';
        b.saetze.forEach(function(satz){
          var line = '<p>';
          satz.forEach(function(teil, idx){
            if(idx % 2 === 0){ line += esc(teil); }
            else { line += '<span class="ix-luecke">'+esc(teil)+'</span>'; }
          });
          line += '</p>';
          l += line;
        });
        l += '</div>';
        return l;

      case 'ix_zuordnung':
        var z = '<div class="box box-aufgabe">';
        z += '<div class="box-titel">✏️ Interaktion · '+esc(b.titel||'Zuordnung')+'</div>';
        z += '<div class="ix-meta">Interaktionstyp: Zuordnung – Begriff :: Definition</div>';
        z += '<p>Ordnen Sie die folgenden Begriffe zu:</p>';
        z += '<ul>';
        b.begriffe.forEach(function(g){ z += '<li class="ix-paar">'+esc(g)+' ::</li>'; });
        z += '</ul></div>';
        return z;

      case 'ix_check':
        var c = '<div class="box box-aufgabe">';
        c += '<div class="box-titel">✏️ Interaktion · '+esc(b.titel||'Check')+'</div>';
        c += '<div class="ix-meta">Interaktionstyp: Check/Auswahl – '+esc(b.modus||'SINGLE')+'</div>';
        if(b.frage) c += '<p>'+esc(b.frage)+'</p>';
        b.optionen.forEach(function(o){
          var sym = (b.modus==='MULTIPLE') ? '☐' : '○';
          c += '<div class="ix-option">'+sym+' '+esc(o[0])
             + (o[1] ? ' <span class="ix-korrekt">[korrekt]</span>' : '') + '</div>';
        });
        c += '</div>';
        return c;

      case 'loesung':
        var s = '<details class="loesung">';
        s += '<summary>'+esc(b.titel||'Lösung – nur für Lehrperson')+'</summary>';
        s += '<div class="loesung-inhalt">';
        if(b.inhalt) s += renderListe(b.inhalt);
        if(b.tabelle){
          s += '<table><thead><tr>';
          b.tabelle.kopf.forEach(function(k){ s += '<th>'+esc(k)+'</th>'; });
          s += '</tr></thead><tbody>';
          b.tabelle.zeilen.forEach(function(z){
            s += '<tr>';
            z.forEach(function(cc){ s += '<td>'+esc(cc)+'</td>'; });
            s += '</tr>';
          });
          s += '</tbody></table>';
        }
        s += '</div></details>';
        return s;

      default:
        return '<p>'+esc(JSON.stringify(b))+'</p>';
    }
  }

  // ================= STARTSEITE =================
  function renderStart(){
    var h = '<div class="start-hero">';
    h += '<h1>T1 · Ich beginne einen neuen Lebensabschnitt</h1>';
    h += '<div class="sub">ABU-Lehrmittel für Fachleute Apotheke EFZ · HKV Aarau</div>';
    h += '<div class="sub">10 Module · 30 Lektionen · 1. Lehrjahr</div>';
    h += '<div class="badge">Demo-Ansicht für das ABU-Team · MoS</div>';
    h += '</div>';

    h += '<div class="start-grid">';
    M.forEach(function(mod, i){
      var folienAnz = folienFlach(mod).filter(function(x){ return !x.folie.versteckt; }).length;
      h += '<div class="start-card" data-modul="'+i+'">'
         + '<div class="nr">'+esc(mod.id)+' · '+esc(mod.lebensbezug)+'</div>'
         + '<div class="ti">'+esc(mod.titel)+'</div>'
         + '<div class="lb">'+mod.sektionen.length+' Sektionen · '+folienAnz+' Folien</div>'
         + '</div>';
    });
    h += '</div>';

    h += '<div class="start-info">';
    h += '<strong>Farbsystem des Lehrmittels</strong>';
    h += '<div class="start-legende">';
    var leg = [
      ['var(--lz-blau)','Lernziele'],
      ['var(--the-grau)','Theorie'],
      ['var(--bsp-gruen)','Berufsbezug Apotheke'],
      ['var(--auf-gelb)','Aufgaben & Interaktionen'],
      ['var(--wic-rot)','Wichtiges / Merke'],
      ['var(--lp-grau)','Lösung (für Lehrperson)']
    ];
    leg.forEach(function(p){
      h += '<div class="leg-item"><span class="leg-swatch" style="background:'+p[0]+'"></span>'+p[1]+'</div>';
    });
    h += '</div></div>';

    elContent.innerHTML = h;
    elContent.parentElement.scrollTop = 0;

    // Klick auf Karten
    var cards = elContent.querySelectorAll('.start-card');
    cards.forEach(function(c){
      c.addEventListener('click', function(){
        gotoModul(parseInt(c.getAttribute('data-modul'),10), 0);
      });
    });
  }

  // ================= MODUL-FOLIE RENDERN =================
  function renderFolie(){
    var mod = M[state.modul];
    var flach = folienFlach(mod);
    if(state.folie >= flach.length) state.folie = flach.length-1;
    if(state.folie < 0) state.folie = 0;
    var akt = flach[state.folie];

    var h = '';
    // Modul-Titel nur auf erster Folie gross
    if(state.folie === 0){
      h += '<div class="folie-modul-titel">'+esc(mod.id)+' · '+esc(mod.titel)+'</div>';
      h += '<div class="folie-breadcrumb">ABU APO · HKV Aarau · '+esc(mod.lebensbezug)
         + ' · 3 Lektionen</div>';
    }
    h += '<div class="folie">';
    h += '<div class="folie-h-sektion">'+esc(akt.sektion.nr)+' · '+esc(akt.sektion.titel)+'</div>';
    h += '<div class="folie-titel">'+esc(akt.folie.nr)+' · '+esc(akt.folie.titel)+'</div>';
    if(akt.folie.versteckt){
      h += '<div class="folie-untertitel">Diese Folie ist in KVdigital als «versteckt» markiert – nur für Lehrpersonen sichtbar.</div>';
    }
    akt.folie.bloecke.forEach(function(b){ h += renderBlock(b); });
    h += '</div>';

    elContent.innerHTML = h;
    elContent.parentElement.scrollTop = 0;
    renderTabs(flach);
  }

  // ================= TABS UNTEN =================
  function renderTabs(flach){
    var h = '';
    flach.forEach(function(x, i){
      var cls = 'kv-tab' + (i===state.folie?' active':'') + (x.folie.versteckt?' versteckt':'');
      h += '<div class="'+cls+'" data-folie="'+i+'">'
         + '<span class="tabnum">'+(i+1)+'</span> '
         + esc(x.folie.titel.length>26 ? x.folie.titel.slice(0,24)+'…' : x.folie.titel)
         + '</div>';
    });
    elTabs.innerHTML = h
      + '<div class="kv-tabs-nav">'
      + '<button class="kv-navbtn" id="navPrev">←</button>'
      + '<button class="kv-navbtn" id="navNext">→</button>'
      + '</div>';

    elTabs.querySelectorAll('.kv-tab').forEach(function(t){
      t.addEventListener('click', function(){
        state.folie = parseInt(t.getAttribute('data-folie'),10);
        renderFolie();
      });
    });
    document.getElementById('navPrev').addEventListener('click', function(){
      if(state.folie>0){ state.folie--; renderFolie(); }
      else { gotoModulRelativ(-1); }
    });
    document.getElementById('navNext').addEventListener('click', function(){
      if(state.folie < flach.length-1){ state.folie++; renderFolie(); }
      else { gotoModulRelativ(1); }
    });
    // aktiven Tab in Sicht scrollen
    var act = elTabs.querySelector('.kv-tab.active');
    if(act) act.scrollIntoView({block:'nearest', inline:'center'});
  }

  // ================= TIMELINE SIDEBAR =================
  function renderTimeline(){
    var h = '<div class="kv-tl-line"></div><div class="kv-tl-start">Start</div>';
    // Startseite-Knoten
    h += '<div class="kv-tl-item'+(state.modul===-1?' active':'')+'" data-modul="-1">'
       + '<span class="kv-tl-node"></span>'
       + '<span>Übersicht T1</span></div>';
    M.forEach(function(mod, i){
      h += '<div class="kv-tl-item'+(state.modul===i?' active':'')+'" data-modul="'+i+'">'
         + '<span class="kv-tl-node"></span>'
         + '<span><span class="kv-tl-modnum">'+esc(mod.id)+'</span> '+esc(mod.titel)+'</span>'
         + '</div>';
    });
    elTimeline.innerHTML = h;
    elTimeline.querySelectorAll('.kv-tl-item').forEach(function(it){
      it.addEventListener('click', function(){
        var mi = parseInt(it.getAttribute('data-modul'),10);
        if(mi === -1) gotoStart();
        else gotoModul(mi, 0);
      });
    });
  }

  // ================= NAVIGATION =================
  function gotoStart(){
    state.modul = -1; state.folie = 0;
    elHeaderT.textContent = 'T1 · Ich beginne einen neuen Lebensabschnitt';
    elTabs.innerHTML = '';
    renderTimeline();
    renderStart();
  }
  function gotoModul(i, folie){
    state.modul = i; state.folie = folie||0;
    elHeaderT.textContent = M[i].id + ' · ' + M[i].titel;
    renderTimeline();
    renderFolie();
  }
  function gotoModulRelativ(delta){
    var ni = state.modul + delta;
    if(ni < 0){ gotoStart(); return; }
    if(ni >= M.length){ return; }
    gotoModul(ni, delta>0 ? 0 : folienFlach(M[ni]).length-1);
  }

  // Tastatur-Navigation
  document.addEventListener('keydown', function(e){
    if(state.modul === -1) return;
    if(e.key === 'ArrowRight'){ document.getElementById('navNext').click(); }
    if(e.key === 'ArrowLeft'){ document.getElementById('navPrev').click(); }
  });

  // ================= START =================
  gotoStart();
})();

</script>
