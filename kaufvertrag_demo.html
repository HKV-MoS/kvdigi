<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Der Kauf – Demo</title>
<style>
  /* ZAK-McKRACKEN-LOOK: EGA-Palette, schwarzes Interface, Pixel-Szenen */
  :root{
    --ega-gruen:#55FF55; --ega-gelb:#FFFF55; --ega-cyan:#55FFFF;
    --ega-weiss:#FFFFFF; --ega-grau:#AAAAAA; --ega-dgrau:#555555;
    --ega-magenta:#FF55FF; --ega-rot:#FF5555; --papier:#FBF7EC; --tinte:#10262B;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:"Courier New","Lucida Console",monospace; font-weight:bold;
    color:var(--ega-grau); min-height:100vh; padding:14px;
    /* IK+-Abenddämmerung: gestufte Raster-Bänder + Matten-Boden */
    background:
      repeating-linear-gradient(180deg, transparent 0 24px, rgba(85,255,255,.045) 24px 26px),
      linear-gradient(180deg,
        #000004 0%,   #000004 10%,
        #050a1e 10%,  #050a1e 20%,
        #0a1232 20%,  #0a1232 30%,
        #121a46 30%,  #121a46 40%,
        #221f56 40%,  #221f56 48%,
        #3a2458 48%,  #3a2458 55%,
        #5c2e50 55%,  #5c2e50 60%,
        #8a4440 60%,  #8a4440 63%,
        #123238 63%,  #123238 74%,
        #0e2a30 74%,  #0e2a30 86%,
        #0a2127 86%,  #0a2127 100%);
    background-attachment: fixed;
  }
  .rahmen{max-width:1300px; margin:0 auto;}
  header{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:8px;}
  h1{font-size:1.35rem; letter-spacing:2px; color:var(--ega-gelb); text-transform:uppercase;}
  h1 small{display:block; font-size:.72rem; font-weight:bold; color:var(--ega-dgrau); letter-spacing:1px; text-transform:none;}
  h1{cursor:pointer;}
  h1:hover{color:var(--ega-weiss);}
  .frageDeckel{position:absolute; inset:0; background:rgba(0,0,10,.78); display:flex;
    align-items:center; justify-content:center; z-index:70;}
  .fragePanel{background:#0c1014; border:2px solid var(--ega-gelb); padding:16px 20px;
    max-width:min(540px, 86%); box-shadow:0 0 30px rgba(0,0,0,.8);}
  .fragePanel .frageTitel{color:var(--ega-gelb); font-weight:bold; letter-spacing:.12em; font-size:.8em;}
  .fragePanel .frageText{color:#e8e8e0; margin:.7em 0;}
  .fragePanel .opt{display:block; width:100%; text-align:left; margin:.3em 0;}
  .fragePanel .frageFeedback{color:#cfe8cf; border-top:1px solid #333; padding-top:.6em; margin-top:.7em;}
  .fragePanel .weiter{margin-top:.7em;}
  .rq{
    font-size:1.05rem; color:var(--ega-gelb); border:2px solid var(--ega-dgrau);
    padding:5px 14px; white-space:nowrap; background:#000;
  }
  .weg-anzeige{font-size:.72rem; color:var(--ega-dgrau); margin-top:3px; letter-spacing:1px;}

  /* ------- Bühne ------- */
  .buehne{background:#000; border:2px solid var(--ega-dgrau); box-shadow:0 10px 40px rgba(0,0,0,.65);}
  .szene{width:100%; aspect-ratio:640/260; display:block; background:#000; position:relative;}
  .szene svg{width:100%; height:100%; display:block; image-rendering:pixelated; filter:brightness(1.1);}
  .szene::after{ /* CRT-Zeilen */
    content:""; position:absolute; inset:0; pointer-events:none;
    background:repeating-linear-gradient(180deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px);
  }

  /* ------- Dialogbereich (Verben-Interface) ------- */
  .dialog{padding:12px 16px 16px; border-top:2px solid var(--ega-dgrau); background:#000;}
  .sprecher{
    display:inline-block; font-size:.8rem; letter-spacing:2px;
    margin-bottom:8px; color:var(--ega-cyan);
  }
  .sprecher.erz{color:var(--ega-weiss);}
  .dtext{font-size:.94rem; line-height:1.6; margin-bottom:12px; color:var(--ega-grau);}
  .dtext b{color:var(--ega-gelb); font-weight:bold;}
  .optionen{display:grid; grid-template-columns:1fr 1fr; gap:10px 20px;}
  .opt{
    text-align:left; font:inherit; font-size:.92rem; line-height:1.45;
    background:none; color:var(--ega-gruen);
    border:2px solid var(--ega-gruen); border-radius:12px;
    padding:8px 14px; cursor:pointer;
  }
  .opt:hover{color:var(--ega-gelb); border-color:var(--ega-gelb);}
  .feedback{
    grid-column:1/-1; color:var(--ega-weiss);
    border:2px solid var(--ega-dgrau); border-left:6px solid var(--ega-cyan);
    padding:10px 14px; margin:6px 0 4px; line-height:1.6; font-size:.9rem; background:#000;
  }
  .feedback b{color:var(--ega-gelb);}
  .feedback.neutral{border-left-color:var(--ega-dgrau);}
  .rq-delta{color:var(--ega-gelb);}
  .weiter{
    grid-column:1/-1; justify-self:start; font:inherit; font-size:.95rem;
    background:none; color:var(--ega-gelb); border:2px solid var(--ega-gelb);
    padding:7px 20px; cursor:pointer; letter-spacing:1px;
  }
  .weiter:hover{background:var(--ega-gelb); color:#000;}

  /* ------- Karten (Produkt / Weiche) ------- */
  .kartenreihe{grid-column:1/-1; display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; margin-top:6px;}
  .pkarte{
    background:#000; color:var(--ega-gruen); border:2px solid var(--ega-dgrau);
    padding:12px 10px; cursor:pointer; text-align:center; font:inherit; font-size:.85rem;
  }
  .pkarte:hover{border-color:var(--ega-gelb); color:var(--ega-gelb);}
  .pkarte .pico{font-size:1.8rem; display:block; margin-bottom:6px;}
  .pkarte .pname{display:block; margin-bottom:4px; color:var(--ega-weiss);}
  .pkarte:hover .pname{color:var(--ega-gelb);}
  .pkarte .ppreis{font-size:.85rem;}
  .pkarte.gespielt{opacity:.45;}
  .pkarte .gespielt-tag{display:block; font-size:.72rem; color:var(--ega-cyan); margin-top:5px;}

  /* ------- Vertragskarte (Nahaufnahme-Dokument) ------- */
  .vertrag{
    background:var(--papier); color:var(--tinte); padding:16px 20px; max-width:34rem;
    margin:4px 0 12px; font-size:.85rem; line-height:1.7;
    border:4px solid var(--ega-weiss); box-shadow:8px 8px 0 var(--ega-dgrau);
  }
  .vertrag h3{letter-spacing:3px; margin-bottom:8px; font-size:.95rem;}
  .vertrag td{padding:1px 8px 1px 0; vertical-align:top;}
  .vertrag td:first-child{white-space:nowrap;}
  .stempel{
    display:inline-block; margin-top:8px; padding:2px 10px;
    border:3px solid #C0554D; color:#C0554D; transform:rotate(-4deg); letter-spacing:2px;
  }

  /* ------- Endbildschirm ------- */
  .ende-wertung{font-size:1.4rem; color:var(--ega-gelb); margin:6px 0; letter-spacing:1px;}
  .wegliste{list-style:none; margin:8px 0 12px; color:var(--ega-gruen); font-size:.9rem;}
  .wegliste li{padding:3px 0;}
  .wegliste b{color:var(--ega-weiss); font-weight:bold;}
  .wegliste .offen{color:var(--ega-dgrau);}

  /* ------- Sprechblasen ------- */
  .szene-wrap{position:relative;}
  .blasen{position:absolute; inset:0; pointer-events:none; font-weight:bold;}
  .blase{
    position:absolute; background:var(--papier); color:#1c1c1c;
    border:3px solid #111; border-radius:14px; padding:9px 13px;
    font-size:.84rem; line-height:1.45; box-shadow:4px 4px 0 rgba(0,0,0,.55);
  }
  .blase{pointer-events:auto; cursor:pointer;}
  .blase .bname{display:block; font-size:.6rem; letter-spacing:2px; color:#6a6a6a; margin-bottom:3px;}
  .blase .broll{float:right; font-size:.58rem; letter-spacing:1px; color:#8a8a8a; margin-left:12px;}
  .preisschild{
    float:left; margin:2px 12px 4px 0; padding:7px 10px 6px;
    background:#FFE895; border:2px solid #8a5400; border-radius:6px;
    text-align:center; transform:rotate(-3deg);
    box-shadow:2px 2px 0 rgba(0,0,0,.25); position:relative; min-width:74px;
  }
  .preisschild::before{
    content:""; position:absolute; top:-7px; left:50%; transform:translateX(-50%);
    width:9px; height:9px; border:2px solid #8a5400; border-radius:50%; background:#FBF7EC;
  }
  .preisschild .ps-ico{display:block; font-size:1.7rem; line-height:1.15;}
  .preisschild .ps-name{display:block; font-size:.55rem; color:#5a4632; letter-spacing:.5px; margin-top:2px;}
  .preisschild .ps-preis{display:block; font-size:.78rem; color:#1c1c1c; margin-top:2px;}
  .preisschild.neu .ps-preis{color:#B00020;}
  .preisschild .ps-label{display:block; font-size:.55rem; color:#B00020; letter-spacing:2px;}
  .blase .binhalt{overflow:hidden; max-height:38vh; transition:max-height .3s ease, margin .3s ease;}
  .blase.zu .binhalt{max-height:0;}
  .blase.zu{opacity:.9;}
  .blase.zu .bname{margin-bottom:0;}
  .blase b{color:#8a5400;}
  .blase.meier{top:4%; right:3%; max-width:46%;}
  .blase.meier::after{
    content:""; position:absolute; bottom:-19px; left:24%;
    border:10px solid transparent; border-top:12px solid #111;
  }
  .blase.erz{
    top:4%; left:50%; transform:translateX(-50%); max-width:80%;
    background:rgba(0,0,0,.84); color:var(--ega-grau);
    border-color:var(--ega-dgrau); box-shadow:none; border-radius:8px;
  }
  .blase.erz b{color:var(--ega-gelb);}
  .blase.erz .bname{color:var(--ega-dgrau);}
  .blase.hinweis{
    bottom:5%; left:50%; transform:translateX(-50%); max-width:72%;
    background:rgba(0,0,0,.88); color:var(--ega-weiss);
    border-color:var(--ega-cyan); box-shadow:none; border-radius:8px; font-size:.8rem;
  }
  .blase.hinweis b{color:var(--ega-gelb);}
  .blase.hinweis .rq-delta{color:var(--ega-gelb);}

  /* ------- (alt, ungenutzt) Satzzeile + Verben ------- */
  .satzzeile{
    padding:6px 16px 2px; color:var(--ega-gelb); font-size:.92rem;
    min-height:1.6em; letter-spacing:1px; background:#000;
    border-top:2px solid var(--ega-dgrau);
  }
  .verben{display:flex; flex-wrap:wrap; gap:2px 22px; padding:2px 16px 8px; background:#000;}
  .verb{
    font:inherit; font-size:.9rem; background:none; border:none; cursor:pointer;
    color:var(--ega-gruen); padding:2px 4px; letter-spacing:1px;
  }
  .verb:hover{color:var(--ega-weiss);}
  .verb.aktiv{color:var(--ega-gelb);}
  .kommentar{
    padding:0 16px 8px; color:var(--ega-weiss); font-size:.88rem; line-height:1.5;
    background:#000; min-height:1.4em;
  }
  .kommentar .rq-delta{color:var(--ega-gelb);}
  .szene svg{cursor:crosshair;}
  .hot{fill:transparent; cursor:url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20width%3D'41'%20height%3D'41'%3E%3Crect%20x%3D'17'%20y%3D'0'%20width%3D'7'%20height%3D'14'%20fill%3D'black'%2F%3E%3Crect%20x%3D'17'%20y%3D'27'%20width%3D'7'%20height%3D'14'%20fill%3D'black'%2F%3E%3Crect%20x%3D'0'%20y%3D'17'%20width%3D'14'%20height%3D'7'%20fill%3D'black'%2F%3E%3Crect%20x%3D'27'%20y%3D'17'%20width%3D'14'%20height%3D'7'%20fill%3D'black'%2F%3E%3Crect%20x%3D'19'%20y%3D'2'%20width%3D'3'%20height%3D'10'%20fill%3D'%23FFFF55'%2F%3E%3Crect%20x%3D'19'%20y%3D'29'%20width%3D'3'%20height%3D'10'%20fill%3D'%23FFFF55'%2F%3E%3Crect%20x%3D'2'%20y%3D'19'%20width%3D'10'%20height%3D'3'%20fill%3D'%23FFFF55'%2F%3E%3Crect%20x%3D'29'%20y%3D'19'%20width%3D'10'%20height%3D'3'%20fill%3D'%23FFFF55'%2F%3E%3Crect%20x%3D'19'%20y%3D'19'%20width%3D'3'%20height%3D'3'%20fill%3D'%23FFFF55'%2F%3E%3C%2Fsvg%3E") 20 20, crosshair;}
  /* Hover-Markierung bewusst entfernt: Entdecken gehört zum Spiel */
  .quelle{font-size:.68rem; color:var(--ega-dgrau); text-align:center; margin-top:10px; line-height:1.6; font-weight:normal; font-family:inherit;}
  /* ------- Vollbild ------- */
  #vollbild{
    font:inherit; font-size:1.15rem; line-height:1;
    background:#000; color:var(--ega-gruen); border:2px solid var(--ega-dgrau);
    padding:7px 12px; cursor:pointer;
  }
  #vollbild:hover{color:var(--ega-gelb); border-color:var(--ega-gelb);}
  #fx,#musik{
    font:inherit; font-size:.82rem; line-height:1.45; letter-spacing:1px;
    background:#000; color:var(--ega-dgrau); border:2px solid var(--ega-dgrau);
    padding:8px 10px; cursor:pointer;
  }
  #fx:hover,#musik:hover{color:var(--ega-gelb); border-color:var(--ega-gelb);}
  #fx.an,#musik.an{color:var(--ega-gruen); border-color:var(--ega-gruen);}
  .buehne:fullscreen{
    display:flex; flex-direction:column; overflow:auto;
    padding:10px 14px;
    background:
      repeating-linear-gradient(180deg, transparent 0 24px, rgba(85,255,255,.045) 24px 26px),
      linear-gradient(180deg,
        #000004 0%,   #000004 10%,
        #050a1e 10%,  #050a1e 20%,
        #0a1232 20%,  #0a1232 30%,
        #121a46 30%,  #121a46 40%,
        #221f56 40%,  #221f56 48%,
        #3a2458 48%,  #3a2458 55%,
        #5c2e50 55%,  #5c2e50 60%,
        #8a4440 60%,  #8a4440 63%,
        #123238 63%,  #123238 74%,
        #0e2a30 74%,  #0e2a30 86%,
        #0a2127 86%,  #0a2127 100%);
  }
  .buehne:fullscreen .szene-wrap{
    width:100%; max-width:calc(62vh * 640 / 260); margin:0 auto; flex:0 0 auto;
  }
  .buehne:fullscreen .dialog{flex:1 1 auto; overflow:auto; max-width:calc(62vh * 640 / 260); margin:0 auto; width:100%;}
  .buehne:-webkit-full-screen{display:flex; flex-direction:column; overflow:auto; padding:10px 14px;
    background:
      repeating-linear-gradient(180deg, transparent 0 24px, rgba(85,255,255,.045) 24px 26px),
      linear-gradient(180deg,
        #000004 0%,   #000004 10%,
        #050a1e 10%,  #050a1e 20%,
        #0a1232 20%,  #0a1232 30%,
        #121a46 30%,  #121a46 40%,
        #221f56 40%,  #221f56 48%,
        #3a2458 48%,  #3a2458 55%,
        #5c2e50 55%,  #5c2e50 60%,
        #8a4440 60%,  #8a4440 63%,
        #123238 63%,  #123238 74%,
        #0e2a30 74%,  #0e2a30 86%,
        #0a2127 86%,  #0a2127 100%);}

  /* ------- Prätorianer (Referenz: The Net, 1995) ------- */
  #pi{
    font:inherit; font-size:.78rem; background:none; border:none; cursor:default;
    color:#2e2e2e; padding:0 5px; margin-left:8px;
  }
  #pi:hover{color:var(--ega-cyan); cursor:pointer; text-shadow:0 0 6px rgba(85,255,255,.6);}
  .galerie{
    position:fixed; inset:4vh 4vw; z-index:99; overflow:auto;
    background:#000; border:3px solid var(--ega-cyan); padding:18px;
    box-shadow:0 0 60px rgba(85,255,255,.25);
  }
  .galerie h2{color:var(--ega-cyan); font-size:1rem; letter-spacing:3px; margin-bottom:12px;}
  .galerie .graster{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px;}
  .gzelle{border:1px solid var(--ega-dgrau); padding:8px; text-align:center;}
  .gzelle img{max-width:100%; max-height:90px; display:block; margin:0 auto 6px; background:#111;}
  .gzelle .gname{font-size:.62rem; color:var(--ega-grau); word-break:break-all;}
  .gzelle .gstatus{font-size:.68rem; letter-spacing:1px;}
  .gzelle .ok{color:var(--ega-gruen);}
  .gzelle .fehlt{color:var(--ega-rot);}
  .galerie .gzu{
    position:sticky; top:0; float:right; font:inherit; font-weight:bold;
    background:#000; color:var(--ega-gelb); border:2px solid var(--ega-gelb);
    padding:4px 14px; cursor:pointer;
  }
  @media (max-width:640px){
    .optionen{grid-template-columns:1fr;}
    h1{font-size:1.05rem;}
  }
@keyframes rechnerZappel{
  0%,100%{ opacity:1; transform:rotate(0deg); }
  8%{ opacity:.3; } 16%{ opacity:1; } 24%{ opacity:.3; } 32%{ opacity:1; }
  45%{ transform:rotate(-5deg); } 60%{ transform:rotate(5deg); } 75%{ transform:rotate(0deg); }
}
#sp-rechner{ transform-box:fill-box; transform-origin:center; cursor:pointer; }
#sp-fenster{ opacity:0; transition:opacity .22s; }
#sp-fenster.auf{ opacity:1; }
#sp-kraehe{ opacity:0; transition:opacity 1.4s; }
#sp-kraehe.da{ opacity:1; }
#sp-rektor{ opacity:0; transition:opacity .7s; cursor:pointer; }
#sp-rektor.da{ opacity:1; }
#sp-credits{ transition: transform 15s linear; }
.szene.ende-roll #sp-credits{ transform: translateY(-320px); }
.endeFade{ position:absolute; inset:0; background:#000; opacity:0; transition:opacity 14s linear; pointer-events:none; z-index:40; }
.endeFade.an{ opacity:1; }
.startTor{ position:absolute; inset:0; z-index:70; background:#000; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:1.1rem; text-align:center; padding:20px; }
.startTor h2{ color:#FFFF55; font-size:1.6rem; letter-spacing:.35em; margin:0; }
.startTor p{ color:#AAAAAA; font-size:.85rem; max-width:34rem; line-height:1.6; margin:0; }
.startTor button{ font:inherit; font-weight:700; font-size:1.05rem; color:#55FF55; background:#0a140a;
  border:2px solid #55FF55; border-radius:12px; padding:.9rem 2.2rem; cursor:pointer; }
.startTor button:hover{ background:#55FF55; color:#0a140a; }
.introDeckel{ position:absolute; inset:0; z-index:60; background:#000; }
.introDeckel video{ width:100%; height:100%; object-fit:cover; display:block; }
.introDeckel .introHinweis{ position:absolute; right:12px; bottom:8px; color:#8f8; font-size:.7rem;
  font-family:inherit; text-shadow:0 1px 3px #000; opacity:.85; pointer-events:none; }
.introDeckel video{ transition:opacity .7s; }
.introDeckel.schwarz video{ opacity:0; }
.introDeckel.weg{ opacity:0; transition:opacity 1.1s; }
#sp-schild2{ opacity:0; transition:opacity 1.6s steps(8); }
#sp-schild2.schild-an{ opacity:1; }
.rechner-zappel{ animation: rechnerZappel 1.9s ease-in-out infinite; }
</style>
</head>
<body>
<div class="rahmen">
  <header>
    <h1 id="titel" title="Zurück zum Anfang">Der Kauf<small>Ein Rechtsfall in drei Wegen · Kaufvertrag nach OR</small></h1>
    <div style="display:flex; align-items:flex-start; gap:10px;">
      <input id="lautMusik" type="range" min="0" max="100" step="5" title="Musik-Lautstärke" style="width:104px; accent-color:#55FF55; align-self:center;">
      <button id="musik" type="button" title="Musik ein/aus">♫</button>
      <input id="lautFx" type="range" min="0" max="100" step="5" title="FX-Lautstärke" style="width:104px; accent-color:#55FF55; align-self:center;">
      <button id="fx" type="button" title="Soundeffekte ein/aus">FX</button>
      <button id="vollbild" type="button" title="Vollbild (Esc beendet)">⛶</button>
      <div>
        <div class="rq" id="rq-anzeige">RQ 0</div>
        <div class="weg-anzeige" id="weg-anzeige">Rechtsquotient</div>
      </div>
    </div>
  </header>

  <div class="buehne">
    <div class="szene-wrap">
      <div class="szene" id="szene"></div>
      <div class="blasen">
        <div id="blase-dialog"></div>
        <div id="blase-hinweis"></div>
      </div>
    </div>
    <div class="dialog" id="dialog"></div>
  </div>

  <p class="quelle">
    Rechtsgrundlagen: OR Art. 1 ff. (Vertragsabschluss), Art. 102–109 (Verzug), Art. 184–199 (Kaufvertrag), Art. 201 (Prüf- und Rügepflicht) ·
    Fiktives Lernszenario der HKV Aarau · Figuren und Firma frei erfunden.
    <button id="pi" type="button" aria-label="π">π</button>
  </p>
</div>

<script>
(function(){
'use strict';

/* =====================================================
   DER KAUF – Visual-Novel-Engine
   Akt 0 Produktwahl · Akt 1 Vertragsschluss · Weiche ·
   Weg L (Lieferverzug) · Weg Z (Zahlungsverzug) · Weg M (Mängelrüge)
   ===================================================== */

const PRODUKTE = [
  { id:'handy',  ico:'📱', name:'Smartphone «Nova X»', nom:'das Smartphone', akk:'das Smartphone', preis:690,  neupreis:1099,
    mangel:'Der Akku lädt nur noch bis 40 Prozent, und auf der Rückseite zeigt sich ein feiner Riss.' },

/* ---------- Zustand ---------- */
const zustand = {
  produkt:null, rq:0, rqAkt1:0,
  flags:{}, flagsAkt1:{},
  weg:null,
  ergebnisse:{},          // wegKey -> RQ des Durchlaufs
  funde:{},               // Hotspot-Entdeckungen
  undoJoker:1,            // 1x Auswahl zuruecknehmen pro Abschnitt
};

/* ---------- Geldhelfer ---------- */
function chf(betrag){
  const ganz = Math.round(betrag*20)/20;   // auf 5 Rp.
  const s = ganz.toFixed(2).replace('.00','.–');
  return "CHF " + s.replace(/\B(?=(\d{3})+(?!\d))/g, "'");
}
function anzahlung(){ return Math.round(zustand.produkt.preis*0.2); }
function rest(){ return zustand.produkt.preis - anzahlung(); }
function zins2Mt(){ return rest()*0.05*2/12; }

/* ---------- Textschablonen ---------- */
function ersetze(t){
  const p = zustand.produkt;
  if(!p) return t;
  return t
    .replaceAll('{NAME}', p.name)
    .replaceAll('{P}', p.nom)
    .replaceAll('{PA}', p.akk)
    .replaceAll('{Pgross}', p.nom.charAt(0).toUpperCase()+p.nom.slice(1))
    .replaceAll('{PREIS}', chf(p.preis))
    .replaceAll('{NEUPREIS}', chf(p.neupreis))
    .replaceAll('{ANZ}', chf(anzahlung()))
    .replaceAll('{REST}', chf(rest()))
    .replaceAll('{MANGEL}', p.mangel);
}

/* ---------- Pixel-Renderer ---------- */
function pxSzene(bg, zeichnen, overlays, hotKey){
  const G = Array.from({length:52}, ()=> new Array(128).fill(null));
  const R = (x,y,w,h,c)=>{
    for(let j=Math.max(0,y); j<Math.min(52,y+h); j++)
      for(let i=Math.max(0,x); i<Math.min(128,x+w); i++) G[j][i]=c;
  };
  const D = (x,y,w,h,c1,c2)=>{               /* Dithering (Schachmuster) */
    for(let j=Math.max(0,y); j<Math.min(52,y+h); j++)
      for(let i=Math.max(0,x); i<Math.min(128,x+w); i++) G[j][i]=((i+j)%2? c1:c2);
  };
  zeichnen(R,D,G);
  let rects='';
  for(let y=0;y<52;y++){
    let x=0;
    while(x<128){
      const c=G[y][x];
      if(c===null){x++;continue;}
      let x2=x+1; while(x2<128 && G[y][x2]===c) x2++;
      rects += '<rect x="'+(x*Z)+'" y="'+(y*Z)+'" width="'+((x2-x)*Z)+'" height="'+Z+'" fill="'+PAL[c]+'"/>';
      x=x2;
    }
  }
  return '<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">'+
         '<rect width="640" height="260" fill="'+bg+'"/>'+rects+(overlays||'')+hotRects(hotKey)+'</svg>';
}
function hotRects(key){
  let hots='';
  (HOTSPOTS[key]||[]).forEach(h=>{
    hots += '<rect class="hot" data-hid="'+h.id+'" data-hot="'+key+'" x="'+h.x+'" y="'+h.y+'" width="'+h.w+'" height="'+h.h+'"><title>'+h.name+'</title></rect>';
  });
  return hots;
}
const TXT = (x,y,t,f,gr)=> '<text x="'+x+'" y="'+y+'" text-anchor="middle" font-family="Courier New,monospace" '+
  'font-weight="bold" font-size="'+(gr||14)+'" letter-spacing="2" fill="'+f+'">'+t+'</text>';
function sterne(R, n, seed, ymax){
  for(let i=0;i<n;i++){
    const x=(i*53+seed*17)%128, y=(i*29+seed*11)%(ymax||16);
    R(x,y,1,1,(i%4===0)?'F':'E');
  }
}

/* =====================================================
   REKORDER-MUSIK: Vier-Stimmen-Tracker (Eigenkomposition
   «Thema von Meier & Co.» · Paula-Prinzip, default AUS)
   ===================================================== */
const musik = { an:false, ctx:null, timer:null, schritt:0, naechste:0, master:null, echoDelay:null };
const M_ACHTEL = 0.31;                       /* ~97 BPM */
const M_AKKORDE = [                          /* [g1,t3,q5] in Halbtönen rel. A */
  [0,3,7], [3,7,10], [-4,0,3], [-2,2,5],
  [0,3,7], [5,8,12], [-5,-1,2], [0,3,7],
];
const M_ARP = ['g','t','q','G','q','t','Q','T'];   /* klein=unten, gross=+12 */
function mFreq(halbton, basis){ return (basis||110) * Math.pow(2, halbton/12); }
function mTon(zeit, freq, typ, dauer, lautst, ziel){
  const o = musik.ctx.createOscillator(), g = musik.ctx.createGain();
  o.type = typ; o.frequency.value = freq;
  g.gain.setValueAtTime(lautst, zeit);
  g.gain.exponentialRampToValueAtTime(0.001, zeit + dauer);
  o.connect(g); g.connect(ziel || musik.master);
  o.start(zeit); o.stop(zeit + dauer + 0.05);
}
function mHihat(zeit, laut){
  const n = musik.ctx.createBufferSource();
  const buf = musik.ctx.createBuffer(1, musik.ctx.sampleRate*0.06, musik.ctx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * (1 - i/d.length);
  n.buffer = buf;
  const hp = musik.ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=6000;
  const g = musik.ctx.createGain(); g.gain.value = laut;
  n.connect(hp); hp.connect(g); g.connect(musik.master);
  n.start(zeit);
}
function mSchritt(zeit, schritt){
  const takt = Math.floor(schritt/8) % 8;
  const pos  = schritt % 8;
  const [g1,t3,q5] = M_AKKORDE[takt];
  /* Arpeggio (Square, mit Echo) */
  const wahl = M_ARP[pos];
  const ht = { g:g1, t:t3, q:q5, G:g1+12, T:t3+12, Q:q5+12 }[wahl];
  mTon(zeit, mFreq(ht, 220), 'square', M_ACHTEL*0.9, 0.05, musik.echoDelay);
  /* Bass (Triangle) */
  if(pos===0) mTon(zeit, mFreq(g1, 110), 'triangle', M_ACHTEL*3.6, 0.10);
  if(pos===4) mTon(zeit, mFreq(g1+7, 110), 'triangle', M_ACHTEL*3.2, 0.08);
  /* Fläche (2 Sägezähne, pro Takt) */
  if(pos===0){
    mTon(zeit, mFreq(g1, 220), 'sawtooth', M_ACHTEL*7.6, 0.016);
    mTon(zeit, mFreq(t3, 220), 'sawtooth', M_ACHTEL*7.6, 0.014);
  }
  /* HiHat auf Offbeats */
  if(pos%2===1) mHihat(zeit, pos===7 ? 0.05 : 0.028);
}
function musikStart(){
  const AC = (typeof AudioContext!=='undefined') ? AudioContext :
             (typeof webkitAudioContext!=='undefined' ? webkitAudioContext : null);
  if(!AC) return false;
  if(!musik.ctx){
    musik.ctx = new AC();
    musik.master = musik.ctx.createGain(); musik.master.gain.value = 0.9 * laut.m;
    musik.master.connect(musik.ctx.destination);
    /* punktiertes Achtel-Echo für das Arpeggio */
    musik.echoDelay = musik.ctx.createGain();
    const lp = musik.ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1900;
    const del = musik.ctx.createDelay(1.0); del.delayTime.value = M_ACHTEL*1.5;
    const fb = musik.ctx.createGain(); fb.gain.value = 0.32;
    musik.echoDelay.connect(lp); lp.connect(musik.master);
    lp.connect(del); del.connect(fb); fb.connect(del); del.connect(musik.master);
  }
  if(musik.ctx.state==='suspended') musik.ctx.resume();
  musik.an = true;
  musik.schritt = 0;
  musik.naechste = musik.ctx.currentTime + 0.1;
  musik.timer = setInterval(()=>{
    while(musik.naechste < musik.ctx.currentTime + 0.18){
      mSchritt(musik.naechste, musik.schritt);
      musik.naechste += M_ACHTEL;
      musik.schritt++;
    }
  }, 40);
  return true;
}
function musikStopp(){
  musik.an = false;
  if(musik.timer){ clearInterval(musik.timer); musik.timer = null; }
  if(musik.master){
    const t = musik.ctx.currentTime;
    musik.master.gain.cancelScheduledValues(t);
    musik.master.gain.setValueAtTime(musik.master.gain.value, t);
    musik.master.gain.linearRampToValueAtTime(0.0001, t + 0.4);
    setTimeout(()=>{ if(!musik.an && musik.master) musik.master.gain.value = 0.9; }, 600);
  }
}
function musikToggle(){
  if(musik.an){
    musikStopp();
    blaseHinweis('■ Klick. Der Rekorder verstummt.');
  } else {
    if(musikStart()){
      blaseHinweis('▶ Das Band läuft an: <b>«Thema von Meier &amp; Co.»</b> – vier Stimmen, ein Echo, null Urheberrechtsprobleme. (Nochmals doppelklicken stoppt.)', 8000);
    } else {
      blaseHinweis('Der Rekorder knackt nur – Ihr Browser mag keine Musik.');
    }
  }
}

/* =====================================================
   SOUND-FX: synthetische Effekte, default AUS (FX-Schalter)
   ===================================================== */
const FX_BOOST = 2.2;   /* FX generell 120 % lauter; der Regler skaliert darunter */
const fx = { an:false, ctx:null, master:null };
function fxKontext(){
  const AC = (typeof AudioContext!=='undefined') ? AudioContext :
             (typeof webkitAudioContext!=='undefined' ? webkitAudioContext : null);
  if(!AC) return null;
  if(!fx.ctx){
    fx.ctx = new AC();
    fx.master = fx.ctx.createGain();
    fx.master.gain.value = FX_BOOST * laut.x;
    fx.master.connect(fx.ctx.destination);
  }
  if(fx.ctx.state==='suspended') fx.ctx.resume();
  return fx.ctx;
}
function fxRauschen(ctx, dauer){
  const buf = ctx.createBuffer(1, Math.ceil(ctx.sampleRate*dauer), ctx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
  const q = ctx.createBufferSource(); q.buffer = buf;
  return q;
}
function fxWasser(){
  const ctx = fxKontext(); if(!ctx) return;
  const t0 = ctx.currentTime;
  /* Dunkles, ruhiges Plätschern: tiefes Band, träge Wellen */
  const q = fxRauschen(ctx, 4.6);
  const bp = ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=480; bp.Q.value=0.6;
  const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1400;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(0.055, t0+0.6);
  for(let i=0;i<7;i++){
    g.gain.linearRampToValueAtTime(0.035 + Math.random()*0.03, t0 + 0.6 + i*0.55);
  }
  g.gain.linearRampToValueAtTime(0.0001, t0+4.6);
  q.connect(bp); bp.connect(lp); lp.connect(g); g.connect(fx.master);
  q.start(t0);
  /* wenige, tiefe Tropfen – «Blub» statt «Pling» */
  for(let i=0;i<5;i++){
    const tz = t0 + 0.8 + Math.random()*3.2;
    const o = ctx.createOscillator(), og = ctx.createGain();
    o.type='sine'; o.frequency.setValueAtTime(620 + Math.random()*380, tz);
    o.frequency.exponentialRampToValueAtTime(220, tz+0.12);
    og.gain.setValueAtTime(0.035, tz);
    og.gain.exponentialRampToValueAtTime(0.001, tz+0.14);
    o.connect(og); og.connect(fx.master);
    o.start(tz); o.stop(tz+0.16);
  }
}
function fxTicken(){
  const ctx = fxKontext(); if(!ctx) return;
  const t0 = ctx.currentTime;
  for(let i=0;i<12;i++){
    const tz = t0 + 0.15 + i*0.5;
    const o = ctx.createOscillator(), og = ctx.createGain();
    o.type='square';
    o.frequency.value = (i%2===0) ? 1900 : 1400;   /* Tick … Tack */
    og.gain.setValueAtTime(0.05, tz);
    og.gain.exponentialRampToValueAtTime(0.0008, tz+0.045);
    o.connect(og); og.connect(fx.master);
    o.start(tz); o.stop(tz+0.06);
  }
}
function fxZug(){
  const ctx = fxKontext(); if(!ctx) return;
  const t0 = ctx.currentTime;
  /* Fahrtwind: Rauschen mit Tiefpass-Fahrt (nähern - passieren - entfernen) */
  const q = fxRauschen(ctx, 4.2);
  const lp = ctx.createBiquadFilter(); lp.type='lowpass';
  lp.frequency.setValueAtTime(350, t0);
  lp.frequency.exponentialRampToValueAtTime(2600, t0+1.6);
  lp.frequency.exponentialRampToValueAtTime(280, t0+4.1);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(0.22, t0+1.6);
  g.gain.linearRampToValueAtTime(0.0001, t0+4.2);
  q.connect(lp); lp.connect(g); g.connect(fx.master);
  q.start(t0);
  /* Schienen-Klackern: da-dumm ... da-dumm */
  for(let i=0;i<7;i++){
    const basis = t0 + 0.5 + i*0.46;
    [0, 0.09].forEach(off=>{
      const k = fxRauschen(ctx, 0.03);
      const hp = ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=900;
      const kg = ctx.createGain();
      const naehe = Math.sin(Math.PI * (i+1)/8);          /* laut in der Mitte */
      kg.gain.setValueAtTime(0.10*naehe, basis+off);
      kg.gain.exponentialRampToValueAtTime(0.001, basis+off+0.03);
      k.connect(hp); hp.connect(kg); kg.connect(fx.master);
      k.start(basis+off);
    });
  }
  /* Doppler-Horn */
  [311, 415].forEach(f=>{
    const o = ctx.createOscillator(), og = ctx.createGain();
    o.type='sawtooth';
    o.frequency.setValueAtTime(f*1.04, t0+1.1);
    o.frequency.linearRampToValueAtTime(f*0.94, t0+1.7);
    og.gain.setValueAtTime(0.0001, t0+1.1);
    og.gain.linearRampToValueAtTime(0.045, t0+1.2);
    og.gain.linearRampToValueAtTime(0.0001, t0+1.75);
    o.connect(og); og.connect(fx.master);
    o.start(t0+1.1); o.stop(t0+1.8);
  });
}
function fxBlip(){
  const ctx = fxKontext(); if(!ctx) return;
  const t0 = ctx.currentTime;
  [[660,0],[990,0.12]].forEach(([f,off])=>{
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type='sine'; o.frequency.value=f;
    g.gain.setValueAtTime(0.06, t0+off);
    g.gain.exponentialRampToValueAtTime(0.001, t0+off+0.1);
    o.connect(g); g.connect(fx.master);
    o.start(t0+off); o.stop(t0+off+0.12);
  });
}
const FX_HOTSPOTS = { uhr:fxTicken, bahnhof:fxZug };
/* Echte Sounddateien (z. B. von elevenlabs.io) werden bevorzugt,

/* =====================================================
   FREITAGABEND-GROOVE (Musik-Kanal, separat schaltbar)
   ===================================================== */
const grv = { an:true, ctx:null, timer:null, schritt:0, naechste:0, master:null, echo:null };
const GRV_T = 0.167;
const GRV_BASS = [
  [3,7,10,12], [3,2,0,-2], [5,8,12,10], [-2,2,5,8],
  [3,7,10,12], [0,4,7,10], [5,8,12,8],  [-2,2,5,-2],
];
const GRV_STABS = [ [7,14],[7,14],[8,15],[14,20],[7,14],[16,22],[8,15],[14,20] ];
const GRV_MEL = [
  [[0,10,2],[2,12,1],[3,15,2],[5,12,1],[6,10,2],[9,7,3]],
  [[0,9,1],[1,10,2],[3,7,2],[6,3,3]],
  [[0,8,2],[2,10,1],[3,12,2],[5,13,1],[6,15,3],[9,12,3]],
  [[0,14,2],[2,12,1],[3,10,2],[5,8,1],[6,5,3],[9,2,3]],
  [[0,10,2],[2,12,1],[3,15,2],[5,12,1],[6,10,2],[9,7,3]],
  [[0,16,2],[2,14,1],[3,12,2],[5,10,1],[6,16,3],[9,12,3]],
  [[0,8,2],[2,12,1],[3,15,2],[5,17,1],[6,15,3]],
  [[0,14,2],[2,15,1],[3,14,2],[5,10,1],[6,7,2],[8,3,4]],
];
function grvFreq(ht, basis){ return (basis||110) * Math.pow(2, ht/12); }
function grvTon(zeit, freq, typ, dauer, laut, ziel){
  const o = grv.ctx.createOscillator(), g = grv.ctx.createGain();
  o.type = typ; o.frequency.value = freq;
  g.gain.setValueAtTime(laut, zeit);
  g.gain.exponentialRampToValueAtTime(0.001, zeit + dauer);
  o.connect(g); g.connect(ziel || grv.master);
  o.start(zeit); o.stop(zeit + dauer + 0.05);
}
function grvRausch(zeit, laut, hp, ms){
  const n = grv.ctx.createBufferSource();
  const buf = grv.ctx.createBuffer(1, grv.ctx.sampleRate*ms, grv.ctx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * (1 - i/d.length);
  n.buffer = buf;
  const f = grv.ctx.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp;
  const g = grv.ctx.createGain(); g.gain.value = laut;
  n.connect(f); f.connect(g); g.connect(grv.master);
  n.start(zeit);
}
function grvSchritt(zeit, schritt){
  const takt = Math.floor(schritt/12) % 8, pos = schritt % 12;
  GRV_MEL[takt].forEach(([p, ht, len])=>{
    if(p===pos) grvTon(zeit, grvFreq(ht, 220), 'square', GRV_T*len*0.9, 0.04, grv.echo);
  });
  if(pos%3===0) grvTon(zeit, grvFreq(GRV_BASS[takt][pos/3], 110), 'triangle', GRV_T*2.6, 0.10);
  if(pos===5 || pos===11) GRV_STABS[takt].forEach(ht=> grvTon(zeit, grvFreq(ht, 220), 'sawtooth', GRV_T*1.1, 0.018));
  if(pos%3===0 || pos%3===2) grvRausch(zeit, pos%3===0 ? 0.024 : 0.015, 6500, 0.05);
  if(pos===3 || pos===9) grvRausch(zeit, 0.04, 2500, 0.07);
}
function grvPlaner(){
  while(grv.naechste < grv.ctx.currentTime + 0.25){
    grvSchritt(grv.naechste, grv.schritt);
    grv.naechste += GRV_T; grv.schritt++;
  }
}
function grooveStart(){
  if(!grv.an) return;
  try{ if(grv.ctx && grv.ctx.state==='suspended') grv.ctx.resume(); }catch(e){}
  if(grv.timer) return;
  try{
    if(!grv.ctx){
      const AC = (typeof AudioContext!=='undefined') ? AudioContext :
                 (typeof webkitAudioContext!=='undefined' ? webkitAudioContext : null);
      if(!AC) return;
      grv.ctx = new AC();
      grv.master = grv.ctx.createGain(); grv.master.gain.value = 0.75 * laut.m;
      grv.master.connect(grv.ctx.destination);
      const delay = grv.ctx.createDelay(); delay.delayTime.value = GRV_T*3;
      const fb = grv.ctx.createGain(); fb.gain.value = 0.22;
      const mix = grv.ctx.createGain(); mix.gain.value = 0.5;
      grv.echo = grv.ctx.createGain();
      grv.echo.connect(grv.master);
      grv.echo.connect(delay); delay.connect(fb); fb.connect(delay);
      delay.connect(mix); mix.connect(grv.master);
    }
    grv.master.gain.setValueAtTime(0.75 * laut.m, grv.ctx.currentTime);
    grv.ctx.resume();
    grv.schritt = 0; grv.naechste = grv.ctx.currentTime + 0.08;
    grv.timer = setInterval(grvPlaner, 60);
  }catch(e){}
}

  try{ if(grv.master) grv.master.gain.exponentialRampToValueAtTime(0.001, grv.ctx.currentTime + 0.5); }catch(e){}
}

/* =====================================================
   AMBIENT-FX pro Szene (Loop + Einmal- und Zufalls-Sounds)
   ===================================================== */
const AMBIENT = {
  titel: { loop:'kaufvertrag_fx_strasse.mp3', loopVol:0.12 },
  schule: { loop:'kaufvertrag_fx_schulhaus.mp3', loopVol:0.16 },
  treppe: { loop:'kaufvertrag_fx_schulhaus.mp3', loopVol:0.12 },
  weiche: { loop:'kaufvertrag_fx_schulhaus.mp3', loopVol:0.22 },
  front: { loop:'kaufvertrag_fx_brunnen.mp3', loopVol:0.24 },
  discount: { loop:'kaufvertrag_fx_strasse.mp3', loopVol:0.18,
              einmal:'kaufvertrag_fx_glocke.mp3', einmalVol:0.30, einmalNach:2500,
              zufall:'kaufvertrag_fx_lieferwagen.mp3', zufallVol:0.28 },
};
const amb = { el:null, szene:null, zufallTimer:null, einmalGespielt:{}, aktive:[] };
function ambEinmal(url, vol){
  try{
    const a = new Audio(vurl(url)); a.volume = Math.min(1, vol * FX_BOOST * laut.x);
    amb.aktive.push(a);
    a.addEventListener('ended', ()=>{ const i = amb.aktive.indexOf(a); if(i>=0) amb.aktive.splice(i,1); });
    a.play().catch(()=>{});
  }catch(e){}
}
function ambStop(){
  if(amb.el){ try{ amb.el.pause(); }catch(e){} amb.el = null; }
  if(amb.zufallTimer){ clearInterval(amb.zufallTimer); amb.zufallTimer = null; }
  amb.aktive.forEach(a=>{ try{ a.pause(); }catch(e){} });
  amb.aktive.length = 0;
}
function fxAllesStoppen(){
  ambStop();
  try{ Object.values(fxAudio).forEach(a=>{ try{ a.el.pause(); a.el.currentTime = 0; }catch(e){} }); }catch(e){}
  try{ if(fx.ctx) fx.ctx.suspend(); }catch(e){}
}

function szenenAudio(szene){
  /* Schritte auf dem Weg vom Discounter in die Altstadt */
  if(fx.an && amb.szene==='discount' && szene==='front') ambEinmal('kaufvertrag_fx_schritte.mp3', 0.5);
  const wechsel = (amb.szene !== szene);
  amb.szene = szene;
  if(wechsel){
    ambStop();
    try{ Object.entries(fxAudio).forEach(([hid,a])=>{ if(FX_LOOP[hid]){ a.el.pause(); a.el.currentTime = 0; } }); }catch(e){}
  }
  /* Musik pro Teilbild + Ambient-Tiere */
  musikWechsel(szene);
  tiereWechsel(szene);
  /* Ambient-Loop */
  const cfg = AMBIENT[szene];
  if(!cfg || !fx.an) return;
  if(!amb.el){
    try{
      amb.el = new Audio(vurl(cfg.loop));
      amb.basisVol = cfg.loopVol;
      amb.el.loop = true; amb.el.volume = Math.min(1, cfg.loopVol * FX_BOOST * laut.x);
      amb.el.play().catch(()=>{});
    }catch(e){}
  } else if(amb.el.paused){
    try{ amb.el.play().catch(()=>{}); }catch(e){}
  }
  if(cfg.einmal && !amb.einmalGespielt[szene]){
    amb.einmalGespielt[szene] = true;
    setTimeout(()=>{ if(fx.an && amb.szene===szene) ambEinmal(cfg.einmal, cfg.einmalVol); }, cfg.einmalNach);
  }
  if(cfg.zufall && !amb.zufallTimer){
    amb.zufallTimer = setInterval(()=>{
      if(fx.an && amb.szene===szene && Math.random() < 0.5) ambEinmal(cfg.zufall, cfg.zufallVol);
    }, 35000);
  }
}

function dialogSperren(zu){

    dialogEl.style.pointerEvents = zu ? 'none' : '';
    dialogEl.style.opacity = zu ? '.35' : '';
  }catch(e){}
}

/* Retro-FMV-Intro: laeuft einmal ueber der Titelszene, Klick ueberspringt */
function introZeigen(){
  try{
    const wrap = szeneEl.parentElement;   /* .szene-wrap, position:relative */
    if(!wrap) return;
    const d = document.createElement('div');
    d.className = 'introDeckel';
    d.innerHTML = '<video muted autoplay playsinline preload="auto" src="' + vurl('kaufvertrag_intro.mp4') + '"></video>';
    autoStop();                                  /* das Auto wartet hinter dem Vorhang */
    dialogSperren(true);                         /* waehrend des Flugs wird nicht gestartet */
    let vorbei = false;
    const ende = ()=>{
      if(vorbei) return; vorbei = true;
      d.classList.add('schwarz');                /* Video -> Schwarz */
      setTimeout(()=>{ d.classList.add('weg'); }, 900);        /* Schwarz -> Szene */
      setTimeout(()=>{
        try{ d.remove(); }catch(e){}
        dialogSperren(false);
        if(aktuelleSzeneId === 'titel') autoStart();           /* jetzt darf der Panda */
      }, 2050);
    };
    const v = d.querySelector('video');
    v.addEventListener('ended', ende);
    v.addEventListener('error', ende);
    setTimeout(()=>{ if(d.parentElement) ende(); }, 12000);   /* Sicherheitsnetz */
    wrap.appendChild(d);
    v.play().catch(()=>{});
  }catch(e){}
}

/* =====================================================
   AMBIENT-TIERE: Katze (Discount) + Tauben (Front)
   ===================================================== */
const KATZE_FRAMES = ['kaufvertrag_katze_0.png','kaufvertrag_katze_1.png','kaufvertrag_katze_2.png',
  'kaufvertrag_katze_3.png','kaufvertrag_katze_4.png','kaufvertrag_katze_5.png','kaufvertrag_katze_6.png'];
const katze = { timer:null, phase:0, tick:0, x:-40 };
const KATZE_PLAN = [
  { art:'lauf', bis:300, tempo:-2.2 },             /* aus der Gasse rechts zur Ladentreppe */
  { art:'pose', frame:4, ticks:12 },               /* hinsetzen */
  { art:'wechsel', frames:[5,6], ticks:32, alle:4 },  /* Pfote lecken */
  { art:'pose', frame:4, ticks:10 },
  { art:'lauf', bis:-40, tempo:-2.6 },             /* links im Hauseingang verschwinden */
  { art:'pause', ticks:380 },                      /* ~45 s Ruhe, dann wieder */
];
function katzeZeichne(frame){
  const el = document.getElementById('sp-katze');
  if(!el) return;
  el.setAttribute('x', katze.x);
  el.setAttribute('href', vurl(KATZE_FRAMES[frame]));
}
function katzeTick(){
  const p = KATZE_PLAN[katze.phase];
  katze.tick++;
  const weiter = ()=>{ katze.phase = (katze.phase+1)%KATZE_PLAN.length; katze.tick = 0; };
  if(p.art==='lauf'){
    katze.x += p.tempo;
    katzeZeichne(Math.floor(katze.tick/2)%4);
    if(p.tempo > 0 ? katze.x >= p.bis : katze.x <= p.bis) weiter();
  } else if(p.art==='pose'){
    katzeZeichne(p.frame);
    if(katze.tick >= p.ticks) weiter();
  } else if(p.art==='wechsel'){
    katzeZeichne(p.frames[Math.floor(katze.tick/p.alle)%p.frames.length]);
    if(katze.tick >= p.ticks) weiter();
  } else {
    if(katze.tick===1){ katze.x = 680; katzeZeichne(0); }
    if(katze.tick >= p.ticks) weiter();
  }
}
function reduzierteBewegung(){
  try{ return window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; }
}
function katzeStart(){
  katzeStop();
  if(reduzierteBewegung()){
    katze.x = 300;
    katze.timer = setInterval(()=>{ katze.x = 300; katzeZeichne(4); }, 1500);
    return;
  }
  katze.phase = 0; katze.tick = 0; katze.x = 680;
  katze.timer = setInterval(katzeTick, 120);
}
function katzeStop(){ if(katze.timer){ clearInterval(katze.timer); katze.timer = null; } }

const tauben = { timer:null };
/* Tauben fliegen auf, wenn der Fiat nach dem Badge-Halt beschleunigt */
let taubenFlugAktiv = false;
function taubenFlug(){
  if(taubenFlugAktiv || reduzierteBewegung()) return;
  taubenFlugAktiv = true;
  const start = performance.now();
  const voegel = [
    { id:'sp-taubeA', x:336, y:186, vx:-75, vy:-72, fr:['kaufvertrag_taube_a0.png','kaufvertrag_taube_a1.png'] },
    { id:'sp-taubeB', x:356, y:188, vx:58,  vy:-88, fr:['kaufvertrag_taube_b0.png','kaufvertrag_taube_b1.png'] },
  ];
  function schlag(t){
    const s = (t - start) / 1000;
    let weiter = false;
    voegel.forEach(v=>{
      const el = document.getElementById(v.id);
      if(!el) return;
      if(s < 1.5){
        weiter = true;
        el.setAttribute('x', (v.x + v.vx*s).toFixed(1));
        el.setAttribute('y', (v.y + v.vy*s - 20*s*s).toFixed(1));
        el.setAttribute('href', vurl(v.fr[Math.floor(s/0.09)%2]));
      } else {
        el.setAttribute('opacity','0');
      }
    });
    if(weiter && taubenFlugAktiv) requestAnimationFrame(schlag);
  }
  requestAnimationFrame(schlag);
}

/* Nach der einmaligen Durchfahrt: Tauben kehren zurueck und landen in der Bildmitte */
function taubenMitte(){
  if(aktuelleSzeneId!=='titel' || reduzierteBewegung()) return;
  taubenFlugAktiv = true;
  const start = performance.now();
  const voegel = [
    { id:'sp-taubeA', x0:220, y0:-20, x1:300, y1:203, fr:['kaufvertrag_taube_a0.png','kaufvertrag_taube_a1.png'] },
    { id:'sp-taubeB', x0:430, y0:-14, x1:326, y1:207, fr:['kaufvertrag_taube_b0.png','kaufvertrag_taube_b1.png'] },
  ];
  function anflug(t){
    const s = Math.min(1, (t - start) / 1600);
    const e = s*s*(3-2*s);                       /* sanft einschweben */
    voegel.forEach(v=>{
      const el = document.getElementById(v.id);
      if(!el) return;
      el.setAttribute('opacity','1');
      el.setAttribute('x', (v.x0 + (v.x1-v.x0)*e).toFixed(1));
      el.setAttribute('y', (v.y0 + (v.y1-v.y0)*e).toFixed(1));
      el.setAttribute('href', vurl(s<1 ? v.fr[Math.floor((t-start)/90)%2] : v.fr[0]));
    });
    if(s < 1){ requestAnimationFrame(anflug); }
    else { taubenFlugAktiv = false; }            /* am neuen Ort weiterpicken */
  }
  requestAnimationFrame(anflug);
}
function taubenReset(){
  taubenFlugAktiv = false;
  [['sp-taubeA',336,186],['sp-taubeB',356,188]].forEach(([id,x,y])=>{
    const el = document.getElementById(id);
    if(el){ el.setAttribute('x',x); el.setAttribute('y',y); el.setAttribute('opacity','1'); }
  });
}

function taubenStart(){
  taubenStop();
  if(reduzierteBewegung()) return;
  tauben.timer = setInterval(()=>{
    if(taubenFlugAktiv) return;
    /* Faehrt das Auto vorbei, halten die Tauben inne (Kopf hoch, keine Bewegung) */
    const autoNah = (tiere.szene === 'titel' && auto.raf && auto.x > 120 && auto.x < 500);
    [['sp-taubeA','kaufvertrag_taube_a0.png','kaufvertrag_taube_a1.png'],
     ['sp-taubeB','kaufvertrag_taube_b0.png','kaufvertrag_taube_b1.png']].forEach(([id, oben, unten])=>{
      const el = document.getElementById(id);
      if(!el) return;
      if(autoNah){ el.setAttribute('href', vurl(oben)); return; }
      if(Math.random() < 0.7) el.setAttribute('href', vurl(Math.random() < 0.6 ? unten : oben));
    });
  }, 340);
}
function taubenStop(){ if(tauben.timer){ clearInterval(tauben.timer); tauben.timer = null; } }
const AUTO_FRAMES = ['kaufvertrag_auto_0.png','kaufvertrag_auto_1.png','kaufvertrag_auto_2.png','kaufvertrag_auto_3.png','kaufvertrag_auto_4.png','kaufvertrag_auto_5.png'];
const AUTO_FRAMES_ZUCKEL = AUTO_FRAMES.concat(['kaufvertrag_auto_6.png','kaufvertrag_auto_7.png','kaufvertrag_auto_8.png']);
/* Fluessige Fahrt: requestAnimationFrame, Subpixel-Positionen, Raddrehung nach Strecke */
const auto = { raf:null, statTimer:null, phase:0, x:660, warteBis:0, strecke:0, letztT:0 };
const AUTO_TEMPO_AN = 99;      /* Rastereinheiten pro Sekunde */
const AUTO_PAUSE_MS = 26000;
function autoBasis(x){
  /* Exakt parallel zum Randstein (aus dem Bild gemessen: Steigung -0.1171),
     mit gut 50 cm Abstand: Basis 270 am linken Bildrand */
  return 270 - 0.1171 * x;
}
function autoZeichne(){
  const el = document.getElementById('sp-auto');
  if(!el) return;
  const gr = 0.78 + (660 - auto.x) * 0.00055;   /* naeher beim Betrachter = groesser */
  const w = 124 * gr, h = 62 * gr;
  let wipp = Math.sin(auto.strecke / 5.5) * (auto.phase===2 ? 1.3 : 0.45) * gr; /* Federn, beim Zuckeln kraeftiger */
  if(auto.phase===1) wipp = Math.sin(performance.now() / 58) * 0.25 * gr;        /* Standgas-Vibrieren */
  el.setAttribute('x', auto.x.toFixed(2));
  el.setAttribute('y', (autoBasis(auto.x) - h + wipp).toFixed(2));
  el.setAttribute('width', w.toFixed(2));
  el.setAttribute('height', h.toFixed(2));
  let soll;
  if(auto.phase === 1){
    soll = vurl('kaufvertrag_auto_halt.png');          /* Hand raus: Badge + Daumen hoch */
  } else {
    const menge = auto.phase === 2 ? AUTO_FRAMES_ZUCKEL : AUTO_FRAMES;
    soll = vurl(menge[Math.floor(auto.strecke / 7) % menge.length]);
  }
  if(el.getAttribute('href') !== soll) el.setAttribute('href', soll);
}
const AUTO_STOP_X  = 491;      /* Halt: Daumen auf Hoehe des mittleren Pfostens */
const AUTO_HALT_MS = 3200;
function autoMotor(vol){
  if(!fx.an){ autoMotorStopp(); return; }
  try{
    if(!auto.motor){ auto.motor = new Audio(vurl('kaufvertrag_fx_motor.mp3')); auto.motor.loop = true; }
    auto.motor.volume = Math.min(1, vol * FX_BOOST * laut.x);
    if(auto.motor.paused) auto.motor.play().catch(()=>{});
  }catch(e){}
}
function autoMotorStopp(){ if(auto.motor){ try{ auto.motor.pause(); }catch(e){} } }
function autoSchritt(t){
  if(!auto.letztT) auto.letztT = t;
  const dt = Math.min(0.1, (t - auto.letztT) / 1000);
  auto.letztT = t;
  if(auto.phase === 0){                     /* Einfahrt, bremst sanft vor den Pfosten ab */
    const tempo = Math.max(16, AUTO_TEMPO_AN * Math.min(1, (auto.x - AUTO_STOP_X) / 45));
    auto.x -= tempo * dt;
    auto.strecke += tempo * dt;
    if(auto.x <= AUTO_STOP_X){ auto.phase = 1; auto.warteBis = t + AUTO_HALT_MS; autoMotor(0.07); }
  } else if(auto.phase === 1){              /* Standgas: Badge an die Pfosten */
    if(t >= auto.warteBis){
      auto.phase = 2;
      if(fx.an){ try{ ambEinmal('kaufvertrag_fx_motorstart.mp3', 0.5); }catch(e){} }
      autoMotor(0.26);
      taubenFlug();
    }
  } else if(auto.phase === 2){              /* Zuckel-Ausfahrt nach links */
    const tempo = AUTO_TEMPO_AN * 1.18 * (0.42 + 0.58 * Math.abs(Math.sin(auto.strecke / 2.6)));  /* nach dem Badgen ~18% schneller */
    auto.x -= tempo * dt;
    auto.strecke += tempo * dt;
    if(auto.x <= -40){
      try{ const sch = document.getElementById('sp-schild2'); if(sch) sch.classList.add('schild-an'); }catch(e){}
    }
    if(auto.x <= -185){                   /* einmalige Durchfahrt beendet */
      auto.phase = 3; autoMotorStopp();
      auto.rueckT = setTimeout(taubenMitte, 6000);
      auto.raf = null; autoZeichne(); return;
    }
  }
  autoZeichne();
  auto.raf = requestAnimationFrame(autoSchritt);
}
function autoStart(){
  autoStop();
  if(reduzierteBewegung()){
    auto.x = 500;
    auto.statTimer = setInterval(()=>{ auto.x = 500; auto.strecke = 0; autoZeichne(); }, 1500);
    return;
  }
  auto.phase = 0; auto.x = 660; auto.strecke = 0; auto.letztT = 0;
  autoMotor(0.15);
  auto.raf = requestAnimationFrame(autoSchritt);
}
function autoStop(){
  autoMotorStopp();
  if(auto.rueckT){ clearTimeout(auto.rueckT); auto.rueckT = null; }
  if(auto.raf){ cancelAnimationFrame(auto.raf); auto.raf = null; }
  if(auto.statTimer){ clearInterval(auto.statTimer); auto.statTimer = null; }
}

const LEHRER_FRAMES = ['kaufvertrag_lehrer_0.png','kaufvertrag_lehrer_1.png','kaufvertrag_lehrer_2.png','kaufvertrag_lehrer_3.png'];

const LEHRER_PLAN = [

  { art:'pose', frame:3, ticks:22 },            /* wendet sich kurz zur Tafel hin */
  { art:'pose', frame:0, ticks:55 },

function lehrerTick(){

  const p = LEHRER_PLAN[lehrer.phase];

const rektor = { timer:null, weg:null };
function rektorSchritt(el, vonX, nachX, vonY, nachY, dann){
  let i = 0;
  const t = setInterval(()=>{
    i++;
    const f = i/10;
    el.setAttribute('x', (vonX + (nachX-vonX)*f).toFixed(1));
    el.setAttribute('y', (vonY + (nachY-vonY)*f).toFixed(1));
    if(i >= 10){ clearInterval(t); if(dann) dann(); }
  }, 55);
}
function rektorStart(){
  rektorStop();
  if(reduzierteBewegung()) return;
  function runde(){
    const el = document.getElementById('sp-rektor');
    if(el && aktuelleSzeneId==='schule'){
      el.setAttribute('x', '602'); el.setAttribute('y', '38');
      el.classList.add('da');
      rektorSchritt(el, 602, 585, 38, 46, ()=>{        /* tritt heraus */
        rektor.weg = setTimeout(()=>{
          rektorSchritt(el, 585, 602, 46, 38, ()=>{    /* und zieht sich zurueck */
            try{ el.classList.remove('da'); }catch(e){}
          });
        }, 2800);
      });
    }

/* Auftritt: Rektor kommt von der Treppe (rechts), die Lehrperson durch den
   Durchgang (links) – sie treffen sich am Steingelaender und reden. */
const REKTOR_GEH = ['figur_rektor_geh_0.png','figur_rektor_geh_1.png','figur_rektor_geh_2.png','figur_rektor_geh_3.png','figur_rektor_geh_4.png','figur_rektor_geh_5.png'];
const LEHRER_GEH = ['kaufvertrag_lehrer_geh_0.png','kaufvertrag_lehrer_geh_1.png','kaufvertrag_lehrer_geh_2.png','kaufvertrag_lehrer_geh_3.png','kaufvertrag_lehrer_geh_4.png','kaufvertrag_lehrer_geh_5.png'];
/* Frames nach Schrittweite geordnet und als Ping-Pong abgespielt – so
   oeffnet und schliesst sich der Schritt fluessig statt zu zappeln */
const REKTOR_GEH_SEQ = [4,2,0,5,3,1,3,5,0,2];
const LEHRER_GEH_SEQ = [3,2,4,0,1,5,1,0,4,2];
const auftritt = { raf:null };
function auftrittStop(){ if(auftritt.raf){ cancelAnimationFrame(auftritt.raf); auftritt.raf = null; } }
function treppenAuftritt(){
  auftrittStop();
  gespraechStop();
  if(reduzierteBewegung()){ gespraechStart(); return; }
  const start = performance.now();
  const FIGS = [
    { id:'sp-trektor', fr:REKTOR_GEH, seq:REKTOR_GEH_SEQ, von:400, bis:271, dauer:2700, wGeh:79,
      talkHref:'figur_rektor_steh_3.png', wTalk:38, xTalk:252 },
    { id:'sp-tlehrer', fr:LEHRER_GEH, seq:LEHRER_GEH_SEQ, von:96, bis:194, dauer:2050, wGeh:79,
      talkHref:'kaufvertrag_lehrer_1.png', wTalk:70, xTalk:159 },
  ];
  function schritt(t){
    let laufen = false;
    FIGS.forEach(fig=>{
      const el = document.getElementById(fig.id);
      if(!el) return;
      const p = Math.min(1, (t - start) / fig.dauer);
      const cx = fig.von + (fig.bis - fig.von) * p;
      if(p < 1){
        laufen = true;
        el.setAttribute('width', fig.wGeh);
        el.setAttribute('x', (cx - fig.wGeh/2).toFixed(1));
        const dist = Math.abs(cx - fig.von);
        el.setAttribute('href', vurl(fig.fr[fig.seq[Math.floor(dist / 4.2) % fig.seq.length]]));
      } else {
        el.setAttribute('width', fig.wTalk);
        el.setAttribute('x', fig.xTalk);
        el.setAttribute('href', vurl(fig.talkHref));
      }
    });
    if(aktuelleSzeneId !== 'treppe'){ auftritt.raf = null; return; }
    if(laufen){ auftritt.raf = requestAnimationFrame(schritt); }
    else { auftritt.raf = null; gespraechStart(); }
  }
  auftritt.raf = requestAnimationFrame(schritt);
}
function gespraechStart(){
  gespraechStop();
  gespraech.idx = 0;
  if(reduzierteBewegung()) return;
  gespraech.t1 = setTimeout(function runde(){
    gespraechBlase();
    gespraech.t1 = setTimeout(runde, 4300 + Math.random()*1200);
  }, 2200);
}
function gespraechStop(){
  try{ rektorKopfWeg(); }catch(e){}
  try{ portraetWeg(); }catch(e){}
  if(gespraech.t1){ clearTimeout(gespraech.t1); gespraech.t1 = null; }
  if(gespraech.blase){ clearTimeout(gespraech.blase); gespraech.blase = null; }
}

/* =====================================================
   SCHACH-EASTEREGG: Morphys Matt in zwei (1856)
   Doppelklick aufs Büchergestell öffnet das Brett.
   Lösung solver-verifiziert: 1.Ta6!! und Matt folgt.
   ===================================================== */
const SCHACH_BAUM = { 'a1a6': { 'b8c7':'a6a7', 'b8d6':'a6a7', 'b8e5':'a6a7', 'b8f4':'a6a7', 'b8g3':'a6a7', 'b8h2':'a6a7', 'b7a6':'b6b7' } };
const SCHACH_NATIV = { wk:142, wt:86, wb:75, sk:150, sl:124, sb:78 };
const SCHACH_START = [
  { id:'wk', typ:'wk', feld:'c8' }, { id:'wt', typ:'wt', feld:'a1' }, { id:'wb', typ:'wb', feld:'b6' },
  { id:'sk', typ:'sk', feld:'a8' }, { id:'sl', typ:'sl', feld:'b8' },
  { id:'sb1', typ:'sb', feld:'a7' }, { id:'sb2', typ:'sb', feld:'b7' },
];
const SCHACH_RAND = 5.83, SCHACH_FELD = 11.06;   /* Prozent des Brettbilds */
const schach = { wrap:null, stufe:0, fehl:0, figuren:[], auswahl:null, erwartet:null, vorbei:false };

function schachPos(feld){
  const spalte = feld.charCodeAt(0) - 97;
  const reihe = 8 - parseInt(feld[1], 10);
  return { x: SCHACH_RAND + spalte*SCHACH_FELD, y: SCHACH_RAND + reihe*SCHACH_FELD };
}
function schachFigurAuf(feld){ return schach.figuren.find(f=>f.feld===feld && !f.weg); }
function schachMal(){
  schach.figuren.forEach(f=>{
    if(!f.el) return;
    if(f.weg){ f.el.style.display='none'; return; }
    const p = schachPos(f.feld);
    const hoehe = SCHACH_FELD * 0.92 * (SCHACH_NATIV[f.typ]/150);
    f.el.style.display='block';
    f.el.style.height = hoehe + '%';
    f.el.style.left = (p.x + SCHACH_FELD/2) + '%';
    f.el.style.top = (p.y + (SCHACH_FELD - hoehe)/2) + '%';
    f.el.style.outline = (schach.auswahl===f) ? '3px solid #e8b84b' : 'none';
  });
}
function schachSag(t){
  const el = document.getElementById('schachText');
  if(el) el.innerHTML = t;
}
function schachZug(uci){
  const von = uci.slice(0,2), nach = uci.slice(2,4);
  const ziel = schachFigurAuf(nach);
  if(ziel) ziel.weg = true;                    /* geschlagen */
  const fig = schachFigurAuf(von);
  if(fig) fig.feld = nach;
  try{ ambEinmal('kaufvertrag_fx_schach.mp3', 0.5); }catch(e){}
  schachMal();
}
function schachSchwarz(){
  const antworten = Object.keys(SCHACH_BAUM['a1a6']);
  const wahl = antworten[Math.floor(Math.random()*antworten.length)];
  schachZug(wahl);
  schach.erwartet = SCHACH_BAUM['a1a6'][wahl];
  schach.stufe = 2;
  schachSag(wahl==='b7a6'
    ? 'Schwarz schlägt den Turm: <b>bxa6</b>. War das Opfer ein Fehler? Ihr Zug.'
    : 'Der Läufer muss ziehen – Zugzwang. Jetzt der Schlussstrich: Ihr Zug.');
}
function schachFalsch(){
  schach.fehl++;
  schach.auswahl = null; schachMal();
  const meldungen = [
    'So entkommt der König. Zug zurück – es gibt genau einen Weg.',
    'Nah dran, aber Schwarz überlebt. Denken Sie an Herrn Meier: Manchmal ist das beste Angebot ein Opfer.',
    'Hinweis: Der Turm fürchtet den Bauern nicht. Er lädt ihn ein.',
  ];
  schachSag(meldungen[Math.min(schach.fehl-1, meldungen.length-1)]);
}
function schachKlick(feld){
  if(schach.vorbei || schach.stufe===1) return;
  const fig = schachFigurAuf(feld);
  if(fig && fig.typ[0]==='w'){ schach.auswahl = fig; schachMal(); return; }
  if(!schach.auswahl) return;
  const uci = schach.auswahl.feld + feld;
  if(schach.stufe===0){
    if(uci==='a1a6'){
      schach.auswahl = null; schachZug(uci); schach.stufe = 1;
      schachSag('Ta6!? – Sie stellen den Turm ein …');
      setTimeout(schachSchwarz, 900);
    } else { schachFalsch(); }
  } else if(schach.stufe===2){
    if(uci===schach.erwartet){
      schach.auswahl = null; schachZug(uci);
      schach.vorbei = true;
      let bonus = '';
      try{
        if(!zustand.funde.schachproblem){
          zustand.funde.schachproblem = true;
          setzeRQ(2);
          bonus = ' <span class="rq-delta">+2 RQ · Wer vorausdenkt, gewinnt.</span>';
        }
      }catch(e){}
      schachSag('<b>MATT!</b> Paul Morphy komponierte dieses Problem 1856 – mit neun Jahren.' + bonus);
    } else { schachFalsch(); }
  }
}
function schachAufbau(){
  schach.stufe = 0; schach.fehl = 0; schach.auswahl = null; schach.erwartet = null; schach.vorbei = false;
  schach.figuren = SCHACH_START.map(f=>({ id:f.id, typ:f.typ, feld:f.feld, weg:false, el:null }));
  const brett = schach.wrap.querySelector('.schachBrett');
  brett.querySelectorAll('.schachFigur').forEach(e=>e.remove());
  schach.figuren.forEach(f=>{
    const img = document.createElement('img');
    img.className = 'schachFigur';
    img.src = vurl('kaufvertrag_schach_' + f.typ + '.png');
    img.alt = '';
    f.el = img;
    brett.appendChild(img);
  });
  schachMal();
  schachSag('<b>Weiss zieht und setzt in zwei Zügen matt.</b> Wählen Sie eine weisse Figur, dann das Zielfeld.');
}
const schachMus = { el:null };
function schachMusikStart(){
  if(!grv.an) return;

    grooveStop(); trackStop();
    if(!schachMus.el){ schachMus.el = new Audio(vurl('kaufvertrag_musik_schach.mp3')); schachMus.el.loop = true; }
    schachMus.el.volume = 0.25 * laut.m;

  }catch(e){}
}
function schachMusikStop(){
  try{ if(schachMus.el){ schachMus.el.pause(); schachMus.el.currentTime = 0; } }catch(e){}
  if(aktuelleSzeneId) musikWechsel(aktuelleSzeneId);
}
function schachOeffnen(){

    '.schachKnoepfe button:hover{background:#b8892b;color:#141821}';
  document.head.appendChild(stil);
  const deckel = document.createElement('div');
  deckel.className = 'schachDeckel';
  deckel.innerHTML = '<div class="schachKasten">' +
    '<div class="schachBrett"><img class="grund" src="' + vurl('kaufvertrag_schachbrett.jpg') + '" alt="Schachbrett"></div>' +
    '<div id="schachText"></div>' +
    '<div class="schachKnoepfe"><button id="schachNeu" type="button">Nochmals</button><button id="schachZu" type="button">Schliessen</button></div>' +
    '</div>';
  document.body.appendChild(deckel);
  schach.wrap = deckel;
  const brett = deckel.querySelector('.schachBrett');
  for(let r=0; r<8; r++){
    for(let s=0; s<8; s++){
      const z = document.createElement('div');
      z.className = 'schachZelle';
      z.style.left = (SCHACH_RAND + s*SCHACH_FELD) + '%';
      z.style.top = (SCHACH_RAND + r*SCHACH_FELD) + '%';
      z.style.width = SCHACH_FELD + '%';
      z.style.height = SCHACH_FELD + '%';
      const feld = String.fromCharCode(97+s) + (8-r);
      z.addEventListener('click', ()=>schachKlick(feld));
      brett.appendChild(z);
    }

  deckel.querySelector('#schachNeu').addEventListener('click', schachAufbau);
  deckel.querySelector('#schachZu').addEventListener('click', ()=>{ deckel.style.display='none'; schachMusikStop(); });

const blaseDialogEl = document.getElementById('blase-dialog');
const blaseHinweisEl = document.getElementById('blase-hinweis');
let hinweisTimer = null;

function blaseDialog(sprecher, html, anhang){
  blaseDialogEl.innerHTML='';
  if(!html) return;
  const istMeier = (sprecher==='HERR MEIER' || sprecher==='FRAU MEIER');
  const name = (sprecher==='HERR MEIER') ? haendler().sprecher : sprecher;
  const b = document.createElement('div');
  b.className = 'blase ' + (istMeier?'meier':'erz');
  const nm = document.createElement('span');
  nm.className = 'bname';
  const roll = document.createElement('span');
  roll.className = 'broll'; roll.textContent = '📜 einrollen';
  nm.textContent = name;
  nm.appendChild(roll);
  const inhalt = document.createElement('div');
  inhalt.className = 'binhalt';
  inhalt.innerHTML = (anhang||'') + html;
  b.append(nm, inhalt);
  b.addEventListener('click', ()=>{
    b.classList.toggle('zu');
    roll.textContent = b.classList.contains('zu') ? '📜 ausrollen' : '📜 einrollen';
  });
  blaseDialogEl.appendChild(b);
}
function blaseHinweis(html, dauer){
  if(hinweisTimer){ clearTimeout(hinweisTimer); hinweisTimer=null; }
  if(!html){ blaseHinweisEl.innerHTML=''; return; }
  blaseHinweisEl.innerHTML = '<div class="blase hinweis">'+html+'</div>';
  hinweisTimer = setTimeout(()=>{ blaseHinweisEl.innerHTML=''; }, dauer||6000);
}

function findeHotspot(ziel){
  let el = ziel;
  while(el && el !== szeneEl){
    if(el.getAttribute && el.getAttribute('data-hid')) return el;
    el = el.parentNode;
  }
  return null;
}
function hotspotDaten(el){
  const key = el.getAttribute('data-hot'), hid = el.getAttribute('data-hid');
  return (HOTSPOTS[key]||[]).find(h=>h.id===hid);
}
function meierText(t){
  return t.replaceAll('Herrn Meier', haendler().hotName==='Frau Meier'?'Frau Meier':'Herrn Meier')
          .replaceAll('Herr Meier', haendler().hotName);
}

  const f = AARAU_FRAGEN[hid];

  const wrap = szeneEl.parentElement;
  if(!wrap || wrap.querySelector('.frageDeckel')) return true;

  const box = document.createElement('div');

  misch.forEach(a=>{

function hotspotSchau(h){
  fxFuer(h.id);
  if(AARAU_FRAGEN[h.id] && frageOeffnen(h.id)) return;
  if(h.fund && h.fund.verb==='anschauen' && !zustand.funde[h.id]){
    zustand.funde[h.id]=true;
    setzeRQ(h.fund.rq);
    blaseHinweis(h.fund.text + ' <span class="rq-delta">+'+h.fund.rq+' RQ · Entdeckung!</span>', 9000);
    return;
  }
  let antwort = (h.a && h.a.anschauen) || 'Nichts Besonderes.';
  if(h.id==='meier'){ antwort = haendler().hotAnschauen; }
  blaseHinweis(antwort);
}
function hotspotAktion(h){
  if(h.id==='radio'){ musikToggle(); return; }
  if(h.id==='gestell'){ fxFuer('gestell'); schachOeffnen(); return; }
  if(h.id==='tafel'){ quizOeffnen(); return; }
  fxFuer(h.id);
  let antwort = h.a && (h.a.redemit || h.a.oeffne || h.a.benutze || h.a.nimm);
  if(!antwort) antwort = 'Da gibt es gerade nichts zu tun.';
  if(h.id==='meier') antwort = meierText(antwort);
  blaseHinweis(antwort);
}
let klickTimer = null;
szeneEl.addEventListener('click', (ev)=>{
  const el = findeHotspot(ev.target);
  if(!el){ blaseHinweis(''); return; }
  const h = hotspotDaten(el);
  if(klickTimer){                       /* zweiter Klick kurz danach = Doppelklick */
    clearTimeout(klickTimer); klickTimer=null;
    hotspotAktion(h);
    return;
  }
  klickTimer = setTimeout(()=>{ klickTimer=null; hotspotSchau(h); }, 260);
});

/* ---------- Spielstand (localStorage, uebersteht F5) ---------- */
const SPIELSTAND_KEY = 'derkauf_demo_spielstand_v1';
function speichereSpielstand(id){
  try{
    if(typeof localStorage==='undefined' || !zustand.produkt) return;
    localStorage.setItem(SPIELSTAND_KEY, JSON.stringify({
      v:1, knoten:id,
      produktId:zustand.produkt.id, kaeuferin:zustand.kaeuferin||'m',
      haendler:zustand.haendler||'herr',
      rq:zustand.rq, rqAkt1:zustand.rqAkt1,
      flags:zustand.flags, flagsAkt1:zustand.flagsAkt1,
      weg:zustand.weg, ergebnisse:zustand.ergebnisse,
      funde:zustand.funde, undoJoker:zustand.undoJoker,
    }));
  }catch(e){ /* privater Modus o.ae. - dann eben ohne Speichern */ }
}
function ladeSpielstand(){
  try{
    if(typeof localStorage==='undefined') return false;
    const roh = localStorage.getItem(SPIELSTAND_KEY);
    if(!roh) return false;
    const d = JSON.parse(roh);
    if(d.v!==1 || !d.produktId || !(d.knoten in KNOTEN)) return false;
    const p = PRODUKTE.find(x=>x.id===d.produktId);
    if(!p) return false;
    Object.assign(zustand, {
      produkt:p, kaeuferin:d.kaeuferin, haendler:d.haendler,
      rq:d.rq||0, rqAkt1:d.rqAkt1||0,
      flags:d.flags||{}, flagsAkt1:d.flagsAkt1||{},
      weg:d.weg||null, ergebnisse:d.ergebnisse||{},
      funde:d.funde||{}, undoJoker:(d.undoJoker===0?0:1),
    });
    rqAnzeigen();
    setzeWegAnzeige();
    zeige(d.knoten);
    blaseHinweis('Spielstand geladen – weiter geht\'s. (Klick auf den Titel beginnt von vorne.)', 6000);
    return true;
  }catch(e){ return false; }
}
function loescheSpielstand(){
  try{ if(typeof localStorage!=='undefined') localStorage.removeItem(SPIELSTAND_KEY); }catch(e){}
}

function quizFrageZeigen(){
  quizStopTimer();
  const w = quiz.wrap;
  const fbEl = w.querySelector('#quizFb'), weiter = w.querySelector('#quizWeiter');
  fbEl.style.display = 'none'; weiter.style.display = 'none';
  if(quiz.nr >= QUIZ_FRAGEN.length){ quizEnde(); return; }
  const fr = QUIZ_FRAGEN[quiz.nr];
  w.querySelector('#quizStand').textContent = 'Frage ' + (quiz.nr+1) + ' / ' + QUIZ_FRAGEN.length;
  w.querySelector('#quizPunkte').textContent = quiz.punkte + ' Punkte';
  w.querySelector('#quizFrage').textContent = fr.f;
  const g = w.querySelector('#quizGitter');
  g.innerHTML = '';
  fr.a.forEach((txt, i)=>{
    const b = document.createElement('button');
    b.type = 'button';
    b.style.background = QUIZ_FARBEN[i][0];
    b.innerHTML = '<span class="qform">' + QUIZ_FARBEN[i][1] + '</span>' +
                  '<span class="qtxt">' + txt + '</span>' +
                  '<span class="qkreis"></span>';
    b.addEventListener('click', ()=> quizAntwort(i));
    g.appendChild(b);
  });
  quiz.rest = QUIZ_ZEIT;
  const balken = w.querySelector('#quizBalken');
  balken.style.width = '100%';
  quiz.timer = setInterval(()=>{
    quiz.rest -= 0.1;
    balken.style.width = Math.max(0, quiz.rest/QUIZ_ZEIT*100) + '%';
    if(quiz.rest <= 0){ quizAntwort(-1); }
  }, 100);
}
function quizAntwort(i){
  quizStopTimer();
  const fr = QUIZ_FRAGEN[quiz.nr];
  const w = quiz.wrap;
  const knoepfe = w.querySelectorAll('#quizGitter button');
  knoepfe.forEach((b, nr)=>{
    b.disabled = true;
    const kreis = b.querySelector('.qkreis');
    if(nr === fr.k){ kreis.classList.add('gruen'); kreis.textContent = '✓'; }
    else if(nr === i){ kreis.classList.add('rot'); kreis.textContent = '✗'; }
    else b.classList.add('blass');
  });
  const fbEl = w.querySelector('#quizFb');
  fbEl.classList.remove('richtig','falsch');
  let kopf;
  if(i === fr.k){
    const bonus = 500 + Math.round(500 * Math.max(0, quiz.rest) / QUIZ_ZEIT);
    quiz.punkte += bonus; quiz.richtig++;
    fbEl.classList.add('richtig');
    kopf = '<b class="gross">Richtig! +' + bonus + '</b>';
  } else if(i === -1){
    fbEl.classList.add('falsch');
    kopf = '<b class="gross">Zeit abgelaufen!</b>';
  } else {
    fbEl.classList.add('falsch');
    kopf = '<b class="gross">Falsch.</b>';
  }
  fbEl.innerHTML = kopf + fr.fb;
  fbEl.style.display = 'block';
  w.querySelector('#quizPunkte').textContent = quiz.punkte + ' Punkte';
  const weiter = w.querySelector('#quizWeiter');
  weiter.style.display = 'inline-block';
  weiter.focus();
}

  else if(quiz.richtig >= 9) rang = 'Solide Basis – ein zweiter Durchgang lohnt sich.';
  else rang = 'Noch Luft nach oben – das Spiel kennt den Weg.';

  w.querySelector('#quizGitter').innerHTML = '';
  const fbEl = w.querySelector('#quizFb');
  fbEl.style.display = 'none';
  const weiter = w.querySelector('#quizWeiter');
  weiter.style.display = 'inline-block';

/* ---- Benutzbarer Taschenrechner (Overlay im Retro-Stil) ---- */
const rechnerUi = { wrap:null, anzeige:null, ausdruck:'' };
function rechnerMal(){
  if(!rechnerUi.anzeige) return;
  rechnerUi.anzeige.textContent = rechnerUi.ausdruck === '' ? '0' : rechnerUi.ausdruck.replace(/\*/g,'\u00d7').replace(/\//g,'\u00f7');
}
function rechnerTaste(t){
  if(t === 'C'){ rechnerUi.ausdruck = ''; rechnerMal(); return; }
  if(t === '\u232b'){ rechnerUi.ausdruck = rechnerUi.ausdruck.slice(0, -1); rechnerMal(); return; }
  if(t === '='){
    const a = rechnerUi.ausdruck;
    if(!a || !/^[0-9+\-*/.() ]+$/.test(a)){ return; }
    try{
      const w = Function('"use strict"; return (' + a + ')')();
      if(typeof w === 'number' && isFinite(w)){
        rechnerUi.ausdruck = String(Math.round(w * 100) / 100);
      }
    }catch(e){ rechnerUi.anzeige.textContent = 'FEHLER'; rechnerUi.ausdruck=''; return; }
    rechnerMal(); return;
  }
  if(rechnerUi.ausdruck.length > 24) return;
  rechnerUi.ausdruck += t;
  rechnerMal();
}
function rechnerOeffnen(){
  if(rechnerUi.wrap){ rechnerUi.wrap.style.display='flex'; rechnerMal(); return; }
  const stil = document.createElement('style');
  stil.textContent = '.rechnerDeckel{position:fixed;inset:0;z-index:9400;background:rgba(10,14,20,.85);display:flex;align-items:center;justify-content:center;padding:16px}' +

    '.rechnerKasten h3{color:#f4efe2;font-size:.85rem;margin:.1rem 0 .6rem;letter-spacing:.06em}' +
    '#rechnerAnzeige{background:#b8d8a0;color:#233318;font-family:"Courier New",monospace;font-weight:700;font-size:1.35rem;text-align:right;padding:.5rem .6rem;border-radius:6px;border:2px solid #1c2026;min-height:1.4em;overflow:hidden;white-space:nowrap}' +
    '.rechnerTasten{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}' +
    '.rechnerTasten button{font:inherit;font-weight:700;font-size:1.05rem;background:#e2e5ea;color:#1c2026;border:1px solid #9aa0ac;border-bottom-width:3px;border-radius:8px;padding:.5rem 0;cursor:pointer}' +
    '.rechnerTasten button:active{transform:translateY(1px);border-bottom-width:1px}' +

    '.rechnerZu{margin-top:.5rem}.rechnerZu button{font:inherit;background:#22283a;color:#f4efe2;border:1px solid #b8892b;border-radius:8px;padding:.4rem 1.1rem;cursor:pointer}' +
    '.rechnerZu button:hover{background:#b8892b;color:#141821}';
  document.head.appendChild(stil);
  const deckel = document.createElement('div');
  deckel.className = 'rechnerDeckel';
  deckel.innerHTML = '<div class="rechnerKasten">' +
    '<h3>TASCHENRECHNER</h3>' +
    '<div id="rechnerAnzeige">0</div>' +
    '<div class="rechnerTasten"></div>' +
    '<p class="rechnerFormel"><b>Verzugszins</b> = Kapital \u00d7 5 \u00d7 Tage \u00f7 (100 \u00d7 365)</p>' +
    '<div class="rechnerZu"><button type="button">Schliessen</button></div>' +
    '</div>';
  document.body.appendChild(deckel);
  rechnerUi.wrap = deckel;
  rechnerUi.anzeige = deckel.querySelector('#rechnerAnzeige');
  const feld = deckel.querySelector('.rechnerTasten');
  [['C','op'],['(','op'],[')','op'],['\u00f7','op'],
   ['7',''],['8',''],['9',''],['\u00d7','op'],
   ['4',''],['5',''],['6',''],['-','op'],
   ['1',''],['2',''],['3',''],['+','op'],
   ['0',''],['.',''],['\u232b','op'],['=','gleich']].forEach(([z,kl])=>{
    const b = document.createElement('button');
    b.type='button'; b.textContent = z; if(kl) b.className = kl;
    b.addEventListener('click', ()=>{
      const t = z === '\u00d7' ? '*' : z === '\u00f7' ? '/' : z;
      rechnerTaste(t);
    });
    feld.appendChild(b);
  });
  deckel.querySelector('.rechnerZu button').addEventListener('click', ()=>{ deckel.style.display='none'; });
  deckel.addEventListener('click', (e)=>{ if(e.target === deckel) deckel.style.display='none'; });
  rechnerMal();
}

  kopf.innerHTML = '<b>KONTROLLPULT</b>';
  const zu = document.createElement('button');
  zu.type='button'; zu.textContent='✕';
  zu.style.cssText = 'font:inherit;background:#111;color:#f88;border:1px solid #a44;cursor:pointer;padding:2px 8px';
  zu.addEventListener('click', ()=> p.remove());
  kopf.appendChild(zu);
  p.appendChild(kopf);
  function knopf(text, tu, farbe){
    const b = document.createElement('button');
    b.type='button'; b.textContent = text;
    b.style.cssText = 'font:inherit;font-size:.68rem;margin:1px;padding:3px 6px;background:#111;color:'+(farbe||'#8f8')+';border:1px solid #4a4;cursor:pointer';
    b.addEventListener('click', tu);
    return b;
  }
  function zeile(titel){
    const z = document.createElement('div');
    z.style.cssText = 'margin:4px 0;border-top:1px solid #234;padding-top:4px';
    const t = document.createElement('div');
    t.textContent = titel; t.style.cssText = 'color:#888;margin-bottom:2px';
    z.appendChild(t);
    p.appendChild(z);
    return z;
  }
  const zk = zeile('Knoten');
  Object.keys(KNOTEN).forEach(id=>{
    zk.appendChild(knopf(id, ()=>{
      if(!zustand.produkt){ zustand.produkt = PRODUKTE[0]; zustand.kaeuferin = zustand.kaeuferin || 'm'; }
      zeige(id);
    }));
  });
  const zfig = zeile('Figuren (Szene rendert sofort neu)');
  function figurKnopf(text, tu){
    zfig.appendChild(knopf(text, ()=>{
      tu();
      if(aktuelleSzeneId && bildOk[aktuelleSzeneId]) szeneEl.innerHTML = bildSzene(aktuelleSzeneId);
    }, '#8ff'));
  }
  figurKnopf('Meier: Herr', ()=>{ zustand.haendler = 'herr'; });
  figurKnopf('Meier: Frau', ()=>{ zustand.haendler = 'frau'; });
  figurKnopf('Alex: m', ()=>{ zustand.kaeuferin = 'm'; });
  figurKnopf('Alex: w', ()=>{ zustand.kaeuferin = 'w'; });
  const zmod = zeile('Module');
  zmod.appendChild(knopf('Kahoot-Quiz (20 Fragen)', ()=> quizOeffnen(), '#f8f'));
  const zf = zeile('FX');
  Object.keys(FX_DATEIEN).forEach(hid=>{
    zf.appendChild(knopf(hid, ()=>{ const war = fx.an; fx.an = true; if(!Object.keys(fxAudio).length) fxDateienLaden(); fxFuer(hid); fx.an = war; }));
  });
  Object.keys(FX_HOTSPOTS).forEach(hid=>{
    if(!FX_DATEIEN[hid]) zf.appendChild(knopf(hid+'*', ()=>{ const f = FX_HOTSPOTS[hid]; if(f) f(); }, '#ff8'));
  });
  const zm = zeile('Musik');
  zm.appendChild(knopf('Groove', ()=>{ trackStop(); grooveStop(); const war = grv.an; grv.an = true; grooveStart(); grv.an = war; }));
  [['Elektro','kaufvertrag_musik_elektro.mp3'],['Zimmer','kaufvertrag_musik_zimmer.mp3'],
   ['Weiche','kaufvertrag_musik_weiche.mp3'],['Secrets','kaufvertrag_musik_secrets.mp3'],
   ['Abspann','kaufvertrag_musik_abspann.mp3']].forEach(([nm,url])=>{
    zm.appendChild(knopf(nm, ()=>{
      grooveStop(); trackStop();
      try{ mtrk.el = new Audio(vurl(url)); mtrk.el.loop = true; mtrk.el.volume = 0.4; mtrk.url = url; mtrk.el.play().catch(()=>{}); }catch(e){}
    }));
  });
  zm.appendChild(knopf('■ Stille', ()=>{ grooveStop(); trackStop(); ambStop(); }, '#f88'));
  const zx = zeile('Extras');
  zx.appendChild(knopf('Schach', ()=>{ schachOeffnen(); }));
  zx.appendChild(knopf('Galerie', ()=>{ zeigeGalerie(); }));
  document.body.appendChild(p);
}

function zeigeGalerie(){
  const alt = document.getElementById('galerie');
  if(alt) alt.remove();
  const alle = [];
  Object.entries(SZENEN_BILDER).forEach(([k,u])=> alle.push(['Szene '+k, u]));
  Object.entries(HAENDLER).forEach(([k,h])=> h.frames.forEach((u,i)=> alle.push([k+' '+i, u])));
  Object.entries(KAEUFER).forEach(([k,c])=> c.frames.forEach((u,i)=> alle.push(['alex-'+k+' '+i, u])));
  const g = document.createElement('div');
  g.className='galerie'; g.id='galerie';
  const zu = document.createElement('button');
  zu.className='gzu'; zu.type='button'; zu.textContent='Schliessen ✕';
  zu.addEventListener('click', ()=> g.remove());
  g.appendChild(zu);
  const h2 = document.createElement('h2');
  h2.textContent = 'PRÄTORIANER-KONSOLE · ' + alle.length + ' ASSETS';
  g.appendChild(h2);

  const pultKnopf = document.createElement('button');
  pultKnopf.type='button'; pultKnopf.textContent='🛠 Kontrollpult öffnen (schwebt über dem Spiel)';
  pultKnopf.style.cssText = 'font:inherit;font-size:.8rem;margin:10px 0;padding:8px 14px;background:#111;color:#0ff;border:1px dashed #0ff;cursor:pointer';
  pultKnopf.addEventListener('click', ()=>{ g.remove(); pultZeigen(); });
  g.appendChild(pultKnopf);

  const raster = document.createElement('div'); raster.className='graster';
  alle.forEach(([name,url])=>{
    const z = document.createElement('div'); z.className='gzelle';
    const im = document.createElement('img');
    const st = document.createElement('div'); st.className='gstatus'; st.textContent='…';
    im.addEventListener('load', ()=>{ st.textContent='✓ '+im.naturalWidth+'×'+im.naturalHeight; st.className='gstatus ok'; });
    im.addEventListener('error', ()=>{ st.textContent='FEHLT'; st.className='gstatus fehlt'; });
    im.src = vurl(url);
    const nm = document.createElement('div'); nm.className='gname'; nm.textContent=url;
    z.append(im, nm, st);
    raster.appendChild(z);
  });
  g.appendChild(raster);
  document.body.appendChild(g);
}

document.getElementById('titel').addEventListener('click', ()=>{
  if(zustand.produkt && typeof confirm!=='undefined' &&
     !confirm('Zurück zum Anfang? Der aktuelle Durchlauf geht verloren.')) return;
  neustart();
});
